# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
tone_instructions: "Use conventional commit format for all commit messages"
reviews:
  auto_review:
    enabled: false
    labels:
      - "ready-for-review"
  # Bundled API docs are regenerated by `make documentation` and are marked
  # `linguist-generated` in .gitattributes, which CodeRabbit does not read, so
  # exclude them here instead. Patterns starting with `!` exclude and (with no
  # plain include patterns) leave every other path reviewable.
  path_filters:
    - "!docs/openapi.yaml"
    - "!docs/openapi.json"
    - "!docs/openapi-internal.yaml"
    - "!docs/openapi-internal.json"
    - "!docs/index.html"
    - "!docs/index-public.html"
    - "!docs/index-private.html"
