id: instruction-output-v1
curation_order: 3
name: Instruction and Output Reliability v1
description: >
  Evaluates bare-model instruction and output reliability across explicit
  instruction following, unconstrained JSON/schema compliance, and compound
  constraint satisfaction. Balanced IFBench, JSONSchemaBench Easy, and FollowBench
  coverage measures whether models can satisfy verifiable requirements without
  constrained decoding, tool execution, or multi-step agent scaffolding.
  Part of the Standard LLM Evaluation Suite.
domains:
  - instruction_and_output_reliability
tasks:
  - instruction_following
  - structured_output
  - constraint_following
modalities:
  - text
evaluation_targets:
  - model
industries:
  - enterprise
tags:
  - instruction-following
  - structured-output
  - constraint-following
  - json-schema
  - bare-model
  - standard
pass_criteria:
  threshold: 0.283333
benchmarks:
  - id: ifbench
    provider_id: ifbench
    weight: 0.3333333333333333
    primary_score:
      metric: accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.05
    parameters: {}

  - id: jsonschema_bench_easy
    provider_id: lm_evaluation_harness
    weight: 0.3333333333333333
    primary_score:
      metric: schema_compliance
      lower_is_better: false
    pass_criteria:
      threshold: 0.60
    parameters:
      num_fewshot: 0
      apply_chat_template: true

  - id: followbench
    provider_id: followbench
    weight: 0.3333333333333333
    primary_score:
      metric: hsr
      lower_is_better: false
    pass_criteria:
      threshold: 0.20
    parameters: {}
