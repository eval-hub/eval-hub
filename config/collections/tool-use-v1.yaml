---
id: tool-use-v1
name: Tool Use v1
category: tool_use_and_function_calling

description: >
  Evaluates single-turn function-calling capability using supplied function
  schemas, including function selection, argument generation and structural
  correctness, together with relevance and no-call detection. BFCL categories
  are explicitly restricted to non-agentic call-generation and relevance
  tasks; executable, multi-turn, memory, and web-search workflows are excluded.
  The collection evaluates tool-call generation only and does not execute tools
  or measure multi-step agent behavior.
  Part of the Standard LLM Evaluation Suite (standard-llm-evals-v1).

domains:
  - tool_use_and_function_calling

tasks:
  - call_generation
  - parameter_type_correctness
  - relevance_no_call_detection

modalities:
  - text

evaluation_targets:
  - model

tags:
  - tool-use
  - function-calling
  - call-generation
  - relevance
  - bare-model
  - inspect-evals
  - standard

pass_criteria:
  threshold: 0.60

benchmarks:
  - id: inspect/bfcl
    provider_id: inspect
    weight: 0.5
    primary_score:
      metric: accuracy/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.60
    parameters:
      task_args:
        categories:
          - simple_python
          - simple_java
          - simple_javascript
          - multiple
          - parallel
          - parallel_multiple
          - live_simple
          - live_multiple
          - live_parallel
          - live_parallel_multiple

  - id: inspect/bfcl
    provider_id: inspect
    weight: 0.5
    primary_score:
      metric: accuracy/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.60
    parameters:
      task_args:
        categories:
          - irrelevance
          - live_irrelevance
          - live_relevance

custom:
  design:
    tool: design_collection
    date: '2026-10-07'
    evaluation_goal: >
      Single-turn function selection and call generation from supplied schemas,
      including argument and structural correctness, plus relevance and no-call
      detection. No tool execution loop or multi-step agent behavior.
    strictness: moderate
    candidate_benchmark_count: 334

  scope:
    target: bare_model
    agent_harness: false
    tool_execution: false
    multi_step_scaffolding: false
    browsing: false
    retrieval_execution: false
    post_response_scoring_allowed: true

  coverage_status: covered

  coverage:
    - subtask: call_generation
      status: covered
      benchmark_indices:
        - 0
      note: >
        Single-turn function selection and argument generation from supplied
        schemas.

    - subtask: parameter_type_correctness
      status: covered
      benchmark_indices:
        - 0
      note: >
        Argument and structural correctness, including parameter/type matching
        where represented by BFCL; shares the call-correctness score to avoid
        double-counting.

    - subtask: relevance_no_call_detection
      status: covered
      benchmark_indices:
        - 1
      note: >
        Separate relevance and irrelevance categories evaluate whether the model
        should make a tool call or correctly refrain from calling a tool.

  scoring:
    threshold_status: provisional_not_empirically_calibrated
    collection_threshold_method: >
      Weighted mean of benchmark thresholds in higher-is-better space;
      lower-is-better ceilings contribute 1 - threshold.
    weight_policy: >
      Equal weight between call-generation/correctness and relevance/no-call
      evaluation groups.
    interpretation: >
      Report benchmark and subtask scores alongside the aggregate. The
      collection measures tool-call generation rather than successful tool
      execution or end-to-end agent performance.

  execution_status: configuration_validated_evaluations_not_run

  notes:
    - >
      The same benchmark ID intentionally appears twice with disjoint category
      allowlists. Preserve benchmark indices when reporting results.
    - >
      Verify that the deployed Inspect adapter forwards task_args.categories;
      do not fall back to the default BFCL task.
