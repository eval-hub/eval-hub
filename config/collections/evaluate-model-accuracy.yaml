id: evaluate-model-accuracy
name: evaluate-model-accuracy
category: model-validation
description: >
  Evaluates model accuracy using standard industry research benchmarks
  in inspectai. Allows customers to verify or replicate Model Validation
  results through a common inspectai evaluation harness.
tags:
- accuracy
- evaluate-model-accuracy
- model-validation
- pipeline
pass_criteria:
  threshold: 0.4
benchmarks:
- id: inspect/custom
  provider_id: inspect
  weight: 1
  primary_score:
    metric: accuracy
    lower_is_better: false
  pass_criteria:
    threshold: 0.9
  parameters:
    task: inspect_evals/gsm8k
    task_args:
      fewshot: 0
      presence_penalty: 1.0

- id: inspect/custom
  provider_id: inspect
  weight: 1
  primary_score:
    metric: accuracy
    lower_is_better: false
  pass_criteria:
    threshold: 0.9
  parameters:
    task: inspect_evals/gsm8k
    task_args:
      fewshot: 5
      presence_penalty: 1.0


