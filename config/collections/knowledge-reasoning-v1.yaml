id: knowledge-reasoning-v1
curation_order: 1
name: Knowledge and Reasoning v1
description: >
  Evaluates closed-book, text-only knowledge and reasoning across difficult
  scientific, academic and mathematical problems using GPQA Diamond, HLE and
  MATH-500. The collection measures bare-model reasoning without browsing,
  retrieval or tool assistance. Structured-table and structured-data analysis
  remain coverage gaps.
domains:
  - knowledge_and_reasoning
tasks:
  - reasoning
modalities:
  - text
evaluation_targets:
  - model
industries:
  - enterprise
tags:
  - knowledge
  - reasoning
  - scientific-reasoning
  - mathematical-reasoning
  - bare-model
  - lighteval
  - inspect
  - standard

pass_criteria:
  threshold: 0.256667

benchmarks:
  - id: gpqa:diamond
    provider_id: lighteval
    weight: 0.3333333333333333
    primary_score:
      metric: gpqa_pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.35
    parameters:
      apply_chat_template: true
      num_fewshot: 0
      num_samples: 3
      pass_at_k: 1

  - id: inspect/hle
    provider_id: inspect
    weight: 0.3333333333333333
    primary_score:
      metric: regex_judge/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.12
    parameters:
      task_args:
        include_multi_modal: false
        graders:
          - grader

  - id: math_500
    provider_id: lighteval
    weight: 0.3333333333333333
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.30
    parameters:
      apply_chat_template: true
      num_fewshot: 0
      num_samples: 3
      pass_at_k: 1
