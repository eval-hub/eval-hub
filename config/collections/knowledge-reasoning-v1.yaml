id: knowledge-reasoning-v1
name: Knowledge & Reasoning v1
category: knowledge_reasoning
description: >
  Evaluates broad academic knowledge and expert-level reasoning. GPQA-Diamond tests
  graduate-level science questions that resist internet lookup. HLE (Humanity's Last Exam)
  is a frontier benchmark across dozens of subjects; this collection uses its text-only subset.
  DataBench Lite tests tabular question answering over official sample tables
  using direct answers without generated-code execution.
  Part of the Curated Collections taxonomy (#916).
tags:
  - knowledge
  - reasoning
  - science
  - inspect-evals
  - table-qa
  - curated
domains: [knowledge_and_reasoning]
tasks: [reasoning, data_analysis]
modalities: [text]
evaluation_targets: [model]
curation_order: 1
pass_criteria:
  threshold: 0.235
benchmarks:
  - id: gpqa:diamond
    provider_id: lighteval
    weight: 1
    primary_score:
      metric: gpqa_pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.35

  - id: inspect/hle
    provider_id: inspect
    weight: 1
    primary_score:
      metric: regex_judge/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.12
    parameters:
      task_args:
        include_multi_modal: false
        graders: [grader]

  - id: databench_lite
    provider_id: databench
    weight: 1
    primary_score:
      metric: accuracy
      lower_is_better: false
    # Provisional internal gate based on published GPT-4o Lite test accuracy
    # (56.32%, TeleAI SemEval-2025, Table 5); not an official pass threshold
    # or a controlled reproduction of the paper's evaluation protocol.
    pass_criteria:
      threshold: 0.56
