id: knowledge-reasoning-v1
name: Knowledge & Reasoning v1
category: knowledge_reasoning
description: >
  Evaluates the text-only subset of Humanity's Last Exam (HLE), a multidisciplinary
  benchmark of challenging questions across a broad range of subjects.
  Part of the Curated Collections taxonomy (#916).
tags:
  - knowledge
  - reasoning
  - science
  - inspect-evals
  - curated
domains: [knowledge_and_reasoning]
tasks: [reasoning]
modalities: [text]
evaluation_targets: [model]
curation_order: 1
pass_criteria:
  threshold: 0.235
benchmarks:
  - id: inspect/hle
    provider_id: inspect
    weight: 1
    primary_score:
      metric: accuracy/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.12
    parameters:
      task_args:
        include_multi_modal: false
        graders: [grader]
