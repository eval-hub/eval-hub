id: document-understanding-v1
curation_order: 2
name: Grounded Document Understanding v1
description: >
  Evaluates bare-model understanding of supplied long-context documents and
  passages using RULER and LongBench v2. Coverage includes synthetic extraction,
  passage QA, long-context retrieval and tracking, and broader long-context
  reasoning. These benchmarks are proxies for enterprise document understanding;
  summarization, schema-based extraction, citation/attribution, and explicit
  grounding/faithfulness require additional datasets.
domains:
  - grounded_document_understanding
tasks:
  - long_context_understanding
  - document_qa
  - information_extraction
modalities:
  - text
evaluation_targets:
  - model
industries:
  - enterprise
tags:
  - long-context
  - document-understanding
  - document-qa
  - information-extraction
  - bare-model
  - ruler
  - longbench
  - standard

pass_criteria:
  threshold: 0.2125

benchmarks:
  - id: common-words-extraction
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_all
      lower_is_better: false
    pass_criteria:
      threshold: 0.10
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: frequency-words-extraction
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_all
      lower_is_better: false
    pass_criteria:
      threshold: 0.10
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: qa-squad
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_part
      lower_is_better: false
    pass_criteria:
      threshold: 0.15
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: qa-hotpotqa
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_part
      lower_is_better: false
    pass_criteria:
      threshold: 0.15
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: niah-single-essay
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_all
      lower_is_better: false
    pass_criteria:
      threshold: 0.50
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: variable-tracking
    provider_id: ruler
    weight: 0.125
    primary_score:
      metric: string_match_all
      lower_is_better: false
    pass_criteria:
      threshold: 0.10
    parameters:
      context_lengths:
        - 4096
        - 8192
        - 16384
      num_samples: 100

  - id: longbenchv2
    provider_id: lm_evaluation_harness
    weight: 0.25
    primary_score:
      metric: accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.30
    parameters:
      num_fewshot: 0
      apply_chat_template: true
