id: leaderboard-v2
name: Open LLM Leaderboard v2
category: general
domains: [knowledge_and_reasoning, instruction_and_output_reliability]
tasks: [reasoning, instruction_following]
modalities: [text]
evaluation_targets: [model]
curation_order: 0
description: Comprehensive evaluation suite for general-purpose language models.
tags:
  - leaderboard
pass_criteria:
  threshold: 38.0
benchmarks:
  - id: leaderboard_ifeval
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: inst_level_strict_acc
      lower_is_better: false
    pass_criteria:
      threshold: 80.0
  - id: leaderboard_bbh
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 68.0
  - id: leaderboard_gpqa
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 40.0
  - id: leaderboard_mmlu_pro
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: acc
      lower_is_better: false
    pass_criteria:
      threshold: 60.0
  - id: leaderboard_musr
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 38.0
  - id: leaderboard_math_hard
    provider_id: lm_evaluation_harness
