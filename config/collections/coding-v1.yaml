id: coding-v1
name: Coding v1
category: code
domains: [software]
tasks: [code_generation]
modalities: [text]
evaluation_targets: [model]
curation_order: 0
description: >
  Evaluates code generation capability of instruction-tuned chat LLMs on
  execution-based programming problems. LiveCodeBench v6 contains problems from
  Codeforces, LeetCode, and AtCoder. This fixed release does not establish whether
  problems postdate the evaluated model's knowledge cutoff or exclude contamination.
  Execution-based scoring runs generated code against hidden test cases. The primary
  metric is codegen_pass@1; the request configures pass_at_k=1 and num_samples=3.
  These settings do not establish averaging over three independently seeded runs;
  actual sampling behavior must be verified against the configured adapter.
  SWE-Bench (agentic software engineering) is planned for a future version.
  Part of the Standard LLM Evaluation Suite (standard-llm-evals-v1).
tags:
  - code
  - code-generation
  - competitive-programming
  - execution
  - chat
  - lighteval
  - vllm
  - standard
pass_criteria:
  threshold: 0.30
benchmarks:
  - id: lcb:codegeneration_v6
    provider_id: lighteval
    weight: 1
    primary_score:
      metric: codegen_pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.30
    parameters:
      num_fewshot: 0
      apply_chat_template: true
      pass_at_k: 1
      num_samples: 3
