modalities: [multimodal]
evaluation_targets: [model]
curation_order: 7
pass_criteria:
  threshold: 0.50
benchmarks:
  - id: inspect/docvqa
    provider_id: inspect
    weight: 1
    primary_score:
      metric: anls
      lower_is_better: false
    pass_criteria:
      threshold: 0.50
