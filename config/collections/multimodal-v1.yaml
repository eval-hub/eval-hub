id: multimodal-v1
curation_order: 7
name: Multimodal v1
description: >
  Evaluates vision-language understanding on scanned-document visual question
  answering using DocVQA. Requires a vision-capable model. The collection
  currently measures document VQA using ANLS; dedicated chart and table-image
  QA and general natural-image reasoning are not yet covered.
  Part of the Standard LLM Evaluation Suite (standard-llm-evals-v1).

domains:
  - multimodal
tasks:
  - document_vqa
modalities:
  - multimodal
evaluation_targets:
  - model
tags:
  - multimodal
  - vision
  - document-understanding
  - inspect-evals
  - bare-model
  - standard

pass_criteria:
  threshold: 0.50

benchmarks:
  - id: inspect/docvqa
    provider_id: inspect
    weight: 1
    primary_score:
      metric: anls
      lower_is_better: false
    pass_criteria:
      threshold: 0.50
    parameters: {}
