id: reasoning-v1
name: Reasoning v1
category: reasoning
domains: [knowledge_and_reasoning, instruction_and_output_reliability]
tasks: [reasoning, instruction_following]
modalities: [text]
evaluation_targets: [model]
curation_order: 0
description: >
  Evaluates reasoning and instruction following across knowledge, mathematics, and
  coding tasks. Benchmark-specific prompts, sampling, and endpoint requirements are
  defined by each benchmark's configuration.
  Part of the Standard LLM Evaluation Suite (standard-llm-evals-v1).
tags:
  - reasoning
  - math
  - science
  - chain_of_thought
  - chat
  - lm_eval
  - lighteval
  - vllm
  - standard
pass_criteria:
  # Weighted average (equal weight). AIME 25 has lower weight — very hard competition math.
  # Threshold reflects solid reasoning capability across diverse task types.
  threshold: 0.38
benchmarks:
  - id: leaderboard_mmlu_pro
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 0.40   # 0-shot is harder than 5-shot
    parameters:
      num_fewshot: 0
      apply_chat_template: true

  - id: ifeval
    provider_id: lm_evaluation_harness
    weight: 1
    primary_score:
      metric: inst_level_strict_acc
      lower_is_better: false
    pass_criteria:
      threshold: 0.60
    parameters:
      num_fewshot: 0
      apply_chat_template: true

  - id: math_500
    provider_id: lighteval
    weight: 1
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.30
    parameters:
      num_fewshot: 0
      apply_chat_template: true
      pass_at_k: 1
      num_samples: 3

  - id: aime25
    provider_id: lighteval
    weight: 1   # Competition math — lower absolute scores expected even for strong models
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.15
    parameters:
      num_fewshot: 0
      apply_chat_template: true
      pass_at_k: 1
      num_samples: 8   # 8-seed average per standard protocol
