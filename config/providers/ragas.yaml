id: ragas
name: RAGAS
title: RAGAS
description: >
  Retrieval Augmented Generation Assessment — evaluates RAG pipeline quality
  using metrics like faithfulness, answer relevancy, context precision/recall,
  and more. Models are accessed via OpenAI-compatible endpoints.
runtime:
  k8s:
    image: quay.io/evalhub/community-ragas:latest
    entrypoint:
      - python
      - main.py
    cpu_request: 100m
    memory_request: 128Mi
    cpu_limit: 1000m
    memory_limit: 2Gi
  local:
    command: python tests/features/test_data/runtime/main.py

parameters:
  - name: metrics
    type: array
    default: null
    description: List of RAGAS metric names to evaluate; defaults to the benchmark's metric list.
  - name: embedding_model
    type: string
    default: null
    description: Embedding model name; defaults to the evaluated model.
  - name: embedding_url
    type: string
    default: null
    description: OpenAI-compatible embedding endpoint; defaults to the evaluated model URL.
  - name: judge_model
    type: string
    default: null
    description: >
      Model used for LLM-based RAGAS metrics; defaults to the evaluated model.
      Use a capable structured-output model for smaller evaluated models.
  - name: judge_url
    type: string
    default: null
    description: >
      OpenAI-compatible judge endpoint; defaults to the evaluated model URL.
  - name: judge_api_key
    type: string
    default: null
    description: >
      Optional judge API key. Prefer injecting OPENAI_API_KEY from a Secret or
      runtime environment rather than putting a key in a JobSpec.
  - name: max_tokens
    type: integer
    default: null
    description: Maximum tokens for judge LLM completions.
  - name: temperature
    type: number
    default: null
    description: Sampling temperature for judge LLM completions.
  - name: column_map
    type: object
    default: null
    description: Mapping from dataset column names to RAGAS expected names.
  - name: max_workers
    type: integer
    default: 1
    description: Maximum parallel workers for RAGAS evaluation (1–10).
  - name: data_path
    type: string
    default: null
    description: Explicit path to the dataset file.

benchmarks:
  - id: ragas_rag_default
    name: RAG Default Suite
    description: Default RAG evaluation with answer relevancy, context precision, faithfulness, and context recall
    category: rag_evaluation
    metrics:
      - answer_relevancy
      - context_precision
      - faithfulness
      - context_recall
    tags:
      - ragas
      - rag
      - default
    primary_score:
      metric: faithfulness
      lower_is_better: false
    pass_criteria:
      threshold: 0.5

  - id: ragas_rag_full
    name: RAG Full Suite
    description: Comprehensive RAG evaluation with all available RAGAS metrics
    category: rag_evaluation
    metrics:
      - answer_relevancy
      - answer_similarity
      - context_precision
      - faithfulness
      - context_recall
      - context_entity_recall
      - factual_correctness
      - noise_sensitivity
    tags:
      - ragas
      - rag
      - comprehensive
    primary_score:
      metric: faithfulness
      lower_is_better: false
    pass_criteria:
      threshold: 0.5
