id: lighteval
name: Lighteval
title: Lighteval
description: Lightweight LLM evaluation framework from Hugging Face
runtime:
  k8s:
    image: quay.io/evalhub/community-lighteval:latest
    entrypoint:
      - python
      - main.py
    cpu_request: 500m
    memory_request: 1Gi
    cpu_limit: 4000m
    memory_limit: 8Gi
  local:
    # used for local mode tests (FVT)
    command: python tests/features/test_data/runtime/main.py
benchmarks:
  # Category benchmarks (these expand to multiple tasks)
  - id: knowledge
    name: Factual knowledge suite
    description: Combined factual recall across 57 academic subjects and trivia.
    category: knowledge
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - acc
      - acc_norm
    tags:
      - knowledge
      - lighteval
      - suite
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: hellaswag
    name: Everyday activity completion
    description: Picks the most plausible continuation of an everyday scenario (10,042 examples).
    category: reasoning
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - acc
      - acc_norm
    num_few_shot: 0
    dataset_size: 10042
    tags:
      - reasoning
      - commonsense
      - lighteval
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: openbookqa
    name: Open-book science reasoning
    description: |-
      Answers science questions with access to core facts — tests multi-hop reasoning (500 examples).
    category: knowledge
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - acc
      - acc_norm
    num_few_shot: 0
    dataset_size: 500
    tags:
      - knowledge
      - qa
      - lighteval
    primary_score:
      metric: acc_norm
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: truthfulqa:gen
    name: Misconception resistance (generative)
    description: Tests whether generated answers are truthful and non-misleading (817 questions).
    category: safety
    domains: [trustworthiness]
    tasks: [safety]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - exact_match
    num_few_shot: 0
    dataset_size: 817
    tags:
      - safety
      - truthfulness
      - lighteval
    primary_score:
      metric: exact_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: gsm8k
    name: Grade-school math word problems
    description: |-
      Multi-step arithmetic word problems requiring 2-8 reasoning steps (8-shot, 1,319 examples).
    category: math
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - extractive_match
    num_few_shot: 8
    dataset_size: 1319
    tags:
      - math
      - reasoning
      - lighteval
    primary_score:
      metric: extractive_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: aime24
    name: Aime 2024
    description: American Invitational Mathematics Examination 2024 - competition-level mathematical reasoning
    category: reasoning
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - pass@1
    num_few_shot: 0
    dataset_size: 30
    tags:
      - reasoning
      - math
      - competition
      - lighteval
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: aime25
    name: Aime 2025
    description: American Invitational Mathematics Examination 2025 - competition-level mathematical reasoning
    category: reasoning
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - pass@1
    num_few_shot: 0
    dataset_size: 30
    tags:
      - reasoning
      - math
      - competition
      - lighteval
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: triviaqa
    name: Trivia factual recall
    description: Answers trivia questions using evidence from web pages and Wikipedia.
    category: knowledge
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - acc
      - exact_match
    num_few_shot: 0
    tags:
      - knowledge
      - qa
      - lighteval
    primary_score:
      metric: acc
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
  - id: math_500
    name: MATH-500 competition problems
    description: |-
      500 hand-picked problems from the MATH dataset spanning 7 subject areas (algebra,
      counting, geometry, number theory, probability, pre-calculus, intermediate algebra).
      Tests competition-level mathematical reasoning with multi-step solutions. Primary
      metric is pass@1 averaged over 3 random seeds (k=1, n=3 in lighteval syntax).
    category: math
    domains: [knowledge_and_reasoning]
    tasks: [reasoning]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - pass@1
    num_few_shot: 0
    dataset_size: 500
    tags:
      - math
      - reasoning
      - competition
      - lighteval
    primary_score:
      metric: pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.30
  - id: lcb:codegeneration_v6
    name: LiveCodeBench v6 — code generation
    description: |-
      Real-world competitive programming problems collected from Codeforces, LeetCode, and
      AtCoder after the model knowledge cutoff — eliminates data contamination risk.
      Execution-based evaluation: generated code is run against hidden test cases.
      Primary metric is codegen_pass@1 averaged over 3 random seeds.
    category: code
    domains: [software]
    tasks: [code_generation]
    modalities: [text]
    evaluation_targets: [model]
    metrics:
      - codegen_pass@1
    num_few_shot: 0
    tags:
      - code
      - competitive-programming
      - execution
      - contamination-free
      - lighteval
    primary_score:
      metric: codegen_pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.25
