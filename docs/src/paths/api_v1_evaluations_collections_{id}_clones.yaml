post:
  tags:
    - Collections
  summary: Copy Collection
  description: >
    Creates a new tenant-scoped (custom) collection as a copy of the specified source
    collection. The server copies all CollectionConfig fields from the source, assigns
    a new ID with scope=tenant, and records the source ID in CollectionState.derived_from
    for provenance. The request body may include optional overrides (e.g. a new name).
  operationId: post_collections_id_clones
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        title: Collection Id
      description: ID of the source collection to copy.
  requestBody:
    required: false
    description: >
      Optional field overrides for the cloned collection. All fields are optional —
      any field omitted here is inherited from the source collection.
      This schema mirrors CollectionConfig but with no required fields, since the
      required values are inherited from the source. The curation_order field
      is never accepted here and is always reset to 0 (copies are never curated).
    content:
      application/json:
        schema:
          type: object
          description: >
            Optional field overrides for the cloned collection. All fields are optional —
            any field omitted here is inherited from the source collection.
            This schema mirrors CollectionConfig but with no required fields, since the
            required values are inherited from the source. The curation_order field
            is never accepted here and is always reset to 0 (copies are never curated).
          properties:
            name:
              type: string
              description: New name for the copy. Defaults to source name.
            description:
              type: string
              description: Override description.
            category:
              type: string
              description: Deprecated — use domains.
            tags:
              type: array
              items:
                type: string
              description: Override tags.
            pass_criteria:
              $ref: ../components/schemas/PassCriteria.yaml
              description: Override pass criteria.
            benchmarks:
              type: array
              items:
                $ref: ../components/schemas/CollectionBenchmarkConfig.yaml
              description: Override benchmarks.
            domains:
              type: array
              items:
                type: string
              description: Override domains.
            tasks:
              type: array
              items:
                type: string
              description: Override tasks.
            modalities:
              type: array
              items:
                type: string
              description: Override modalities.
            industries:
              type: array
              items:
                type: string
              description: Override industries.
            ai_entities:
              type: array
              items:
                type: string
              description: Override AI entities.
        examples:
          CopyWithNewName:
            summary: Copy with a new name and domain override
            value:
              name: "my-custom-rag-eval"
              domains:
                - grounded_document_understanding
  responses:
    '201':
      description: Cloned collection created successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CollectionResource.yaml
          examples:
            response:
              summary: Newly cloned custom collection
              value:
                resource:
                  id: "b2c3d4e5-6789-0abc-def1-23456789abcd"
                  tenant: "my-tenant"
                  created_at: "2026-08-25T10:00:00Z"
                  updated_at: "2026-08-25T10:00:00Z"
                  owner: "user@example.com"
                  version_counter: 1
                state:
                  derived_from: "e5f6a7b8-9012-3456-cdef-0123456789ab"
                  run_count: 0
                  pinned_order: 0
                name: "my-rag-evaluation"
                category: "document_understanding"
                tasks:
                  - rag
                  - grounding_discipline
                modalities:
                  - text
                benchmarks:
                  - id: "crag"
                    provider_id: "ragas"
                    weight: 1.0
                    primary_score:
                      metric: "answer_correctness"
                      lower_is_better: false
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
