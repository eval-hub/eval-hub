post:
  tags:
    - Evaluations
  summary: Create Post-Processing Computation
  description: |
    Create an asynchronous post-processing computation. Set `operation_order`
    to control execution order. If it is omitted, no operation order is
    guaranteed.
  operationId: create_evaluations_post_processing
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/StandalonePostProcessingRequest.yaml
        example:
          operations:
            confidence_interval:
              results_data_ref:
                pvc:
                  claim_name: evaluation-results
              primary_score:
                metric: accuracy
              calibration_data_ref:
                - s3:
                    bucket: evaluation-data
                    key: calibration/accuracy
                    secret_ref: s3-secret
                  data_config:
                    format: jsonl
                    columns:
                      label: human_score
                      prediction: judge_score
              significance_level: 0.05
  responses:
    '202':
      description: Post-processing computation accepted.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostProcessingResource.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
