post:
  tags:
    - Collections
  summary: Promote Job as Featured Example
  description: >
    Promotes a completed evaluation job as a featured example result for a custom collection.
    The server fetches the job's scores, builds an ExampleResult snapshot, and appends it to
    the collection's state.example_results. Scores are copied at promotion time and do not
    depend on the originating job remaining in the database.
    Only applicable to tenant-scoped (custom) collections that have a CollectionState.
  operationId: post_collections_id_examples
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        title: Collection Id
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            job_id:
              type: string
              description: ID of the completed evaluation job whose results should be promoted.
            label:
              type: string
              description: >
                Optional display label for this example result (e.g. "RAG Eval Run #14").
                Defaults to the job name if not provided.
          required:
            - job_id
        examples:
          request:
            summary: Promote a completed job as a featured example
            value:
              job_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
              label: "RAG Eval Run #14"
  responses:
    '200':
      description: Example result added successfully. Returns the updated collection.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CollectionResource.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
