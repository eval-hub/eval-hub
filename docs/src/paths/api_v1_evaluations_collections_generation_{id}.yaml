                request:
                  evaluation_goal: Assess agent safety and tool-use risks
                  provider_filter: inspect
                  max_benchmarks: 12
                  strictness: moderate
                status:
                  state: cancelled
                  started_at: '2026-10-29T12:00:01Z'
                  completed_at: '2026-10-29T12:00:03Z'
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
delete:
  tags:
    - Collections
  summary: Delete Collection Generation
  description: |
    Cancel an active generation and remove its retained resource. A delayed
    callback cannot recreate a deleted or cancelled result. A second DELETE
    or an unknown, wrong-type, expired, or cross-tenant ID returns 404.
    Any authorized user in the same tenant may delete the resource. Cluster
    requests require the existing authenticated/authorized X-Tenant context.
    Kubernetes Job TTL and API-result retention are separate.
  operationId: delete_collection_generation
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the backing collection-generation evaluation job.
      schema:
        type: string
  responses:
    '204':
      description: Generation cancelled, if active, and retained state removed. No response body.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
