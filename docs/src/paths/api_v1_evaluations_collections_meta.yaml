get:
  tags:
    - Collections
  summary: Get Collection Metadata
  description: >
    Returns aggregated counts for the Curated Collections UI filter dropdowns.
    The response is a lightweight metadata summary, not a list of collections.
  operationId: get_collections_meta
  parameters:
    - name: scope
      in: query
      required: false
      schema:
        type: string
        enum:
          - system
          - curated
          - tenant
        title: Scope filter
      description: >
        Scopes the counts by collection type. Mirrors the `scope` parameter on `GET /collections`.
        `system` counts all system-defined collections.
        `curated` counts only curated system collections (those with a `curated` block).
        `tenant` counts only tenant (custom) collections.
        When omitted, counts cover all collections.
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            description: Aggregated metadata counts for Curated Collections filter dropdowns.
            properties:
              total_count:
                type: integer
                description: Total number of collections matching the filter.
              categories:
                type: array
                description: Category values with counts. Maps to Michal's 8 enterprise LLM quality domains.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
              modalities:
                type: array
                description: Modality values with counts.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
              tasks:
                type: array
                description: Task/subtask values with counts.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
          examples:
            response:
              summary: Metadata for curated collections
              value:
                total_count: 8
                categories:
                  - id: document_understanding
                    label: Grounded Document Understanding
                    count: 3
                  - id: trustworthiness
                    label: Trustworthiness
                    count: 2
                  - id: knowledge_reasoning
                    label: Knowledge & Reasoning
                    count: 2
                  - id: software
                    label: Software
                    count: 1
                modalities:
                  - id: Text
                    label: Text
                    count: 7
                  - id: Vision
                    label: Vision
                    count: 1
                tasks:
                  - id: RAG
                    label: RAG
                    count: 3
                  - id: Safety
                    label: Safety
                    count: 2
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
