get:
  tags:
    - Collections
  summary: Get Collection Metadata
  description: >
    Returns aggregated counts for Collections UI filter dropdowns and statistics.
    The response is a lightweight metadata summary, not a list of collections.
  operationId: get_collections_meta
  parameters:
    - name: scope
      in: query
      required: false
      schema:
        type: string
        enum:
          - system
          - tenant
        title: Scope filter
      description: >
        Set to `system` to count only curated (system-defined) collections,
        or `tenant` to count only custom (tenant-defined) collections.
        When omitted, counts cover all collections.
        Mirrors the `scope` parameter on `GET /collections`.
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            description: Aggregated metadata counts for Collections filter dropdowns.
            properties:
              total_count:
                type: integer
                description: Total number of collections matching the filter.
              use_cases:
                type: array
                description: Use case values with counts.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
              modalities:
                type: array
                description: Modality values with counts.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
              tasks:
                type: array
                description: Task values with counts.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
              categories:
                type: array
                description: Category values with counts. Mirrors the existing category field on collections.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
          examples:
            response:
              summary: Metadata for curated collections
              value:
                total_count: 8
                use_cases:
                  - id: rag
                    label: RAG
                    count: 3
                  - id: safety
                    label: Safety
                    count: 2
                  - id: llm_quality
                    label: LLM Quality
                    count: 2
                  - id: summarization
                    label: Summarization
                    count: 1
                modalities:
                  - id: Text
                    label: Text
                    count: 8
                tasks:
                  - id: Question Answering (RAG)
                    label: Question Answering (RAG)
                    count: 3
                categories:
                  - id: rag
                    label: rag
                    count: 3
                  - id: safety
                    label: safety
                    count: 2
                  - id: reasoning
                    label: reasoning
                    count: 3
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
