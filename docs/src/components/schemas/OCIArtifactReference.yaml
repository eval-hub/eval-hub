type: object
description: OCI artifact reference.
properties:
  oci_digest:
    type: string
    minLength: 1
    pattern: '\S'
    description: Artifact digest.
    examples:
      - sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  oci_reference:
    type: string
    minLength: 1
    pattern: '\S'
    description: Registry reference identifying the artifact by digest.
required:
  - oci_digest
  - oci_reference
additionalProperties: false
