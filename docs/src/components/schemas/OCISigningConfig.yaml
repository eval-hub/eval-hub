type: object
description: >-
  Optional signing configuration for the evaluation bundle, in local and Kubernetes
  modes. Key-pair signing requires a non-null, non-empty secret_ref. In local mode,
  use file:///absolute/path/to/signing-material to identify a directory on the
  EvalHub service filesystem, including when the service runs in a container.
  Only absolute file URIs with empty authority and no query or fragment are
  accepted; malformed escapes and NUL paths are rejected. File URIs are rejected
  in cluster mode before filesystem access. Kubernetes Secret names retain
  RFC1123 DNS-label syntax for future cluster signing integration.
  Creation validates syntax and mode without reading files. Signing execution is
  not yet wired into the export workflow. When invoked for signing, the local
  resolver reads private.key and optional passphrase.key through a directory-confined
  root with a combined 1 MiB limit. Passphrase bytes are exact, including whitespace
  and newlines; an absent passphrase file means an empty passphrase. There is no
  environment password fallback or interactive prompt. Public keys are not read
  by the service, and the request never contains private key material.
properties:
  type:
    type: string
    enum: [key-pair]
    description: Signing method. Only key-pair is currently supported.
  secret_ref:
    type: string
    minLength: 1
    oneOf:
      - pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
      - pattern: '^file:///[^?#]*$'
    description: >-
      Required for key-pair signing. A local directory file URI (local mode only),
      or a Kubernetes Secret name of at most 63 lowercase alphanumeric/hyphen
      characters with alphanumeric endpoints. File URI paths are decoded once
      with the standard URI parser, without shell expansion or a second unescape.
      The selected directory may resolve through a symlink; fixed-file reads
      remain confined to the opened directory. Filesystem accessibility and key
      validity are deferred to signing time. Secret-name acceptance preserves
      syntax for future Kubernetes integration; no Secret lookup is implemented.
    examples:
      - file:///absolute/path/to/signing-material
      - my-cosign-secret
required:
  - type
allOf:
  - if:
      properties:
        type:
          const: key-pair
      required: [type]
    then:
      properties:
        type: {}
        secret_ref: {}
      required: [secret_ref]
additionalProperties: false
