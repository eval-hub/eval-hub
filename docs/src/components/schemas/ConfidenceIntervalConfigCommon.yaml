type: object
title: ConfidenceIntervalConfigCommon
description: Common configuration for confidence interval post-processing.
properties:
  calibration_data_ref:
    type: array
    minItems: 1
    items:
      $ref: ./CalibrationDataRef.yaml
    description: References to the labeled calibration data used by the computation.
  significance_level:
    type: number
    format: float
    exclusiveMinimum: 0
    exclusiveMaximum: 1
    description: Significance level alpha. For example, 0.7 requests a 30% confidence interval.
required:
  - calibration_data_ref
  - significance_level
