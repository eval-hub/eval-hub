type: object
title: ResultsDataConfigEntry
description: Mapping from a result artifact to per-example scores for post-processing.
properties:
  format:
    type: string
    enum: [auto, json, jsonl, csv, parquet]
    default: auto
    description: File serialization format. JSON may contain a samples or records array.
  path:
    type: string
    minLength: 1
    description: Relative file or directory inside the downloaded artifact.
  columns:
    type: object
    description: Logical fields mapped to literal column names or dotted paths into nested JSON.
    properties:
      sample_id:
        type: string
        minLength: 1
      prediction:
        type: string
        minLength: 1
      label:
        type: string
        minLength: 1
      metric:
        type: string
        minLength: 1
      benchmark_id:
        type: string
        minLength: 1
      provider_id:
        type: string
        minLength: 1
    additionalProperties: false
  selection:
    type: object
    minProperties: 1
    description: Source benchmark identity used for selection and row filtering.
    properties:
      benchmark_id:
        type: string
        minLength: 1
      provider_id:
        type: string
        minLength: 1
      metric:
        type: string
        minLength: 1
    additionalProperties: false
  value_mappings:
    type: object
    description: |
      Explicit conversion of string categories to finite numeric scores, after
      column lookup. When configured for a role, every present value must be
      a declared string category; unknown values fail the computation.
    properties:
      prediction:
        type: object
        minProperties: 1
        additionalProperties:
          type: number
      label:
        type: object
        minProperties: 1
        additionalProperties:
          type: number
    additionalProperties: false
additionalProperties: false
