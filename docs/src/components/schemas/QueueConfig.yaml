type: object
title: QueueConfig
description: >
  Optional workload scheduling queue under a benchmark's direct
  `hardware_config.queue` (e.g. Kueue LocalQueue). When a benchmark references a
  queue-backed HardwareProfile (`spec.scheduling.type: Queue`), that profile's
  LocalQueue name takes precedence over this field at job scheduling time.
required:
  - name
properties:
  kind:
    type: string
    enum:
      - kueue
    default: kueue
    description: >
      Queue integration to use. When omitted, the server behaves as if `kueue` was set.
      Only `kueue` is supported today.
  name:
    type: string
    maxLength: 63
    pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    description: >
      Queue resource name (for Kueue, the LocalQueue name). Must conform to RFC 1123
      DNS label naming (lowercase letters, digits, and internal hyphens; max 63
      characters). Set on the Job as label `kueue.x-k8s.io/queue-name`.
