type: string
readOnly: true
description: |
  Resolved content identity for the test data source (e.g. git commit SHA).
  After the init container writes `.git-metadata`, the runtime sidecar reads it and
  injects the SHA into a status event; Eval Hub persists it here after benchmark
  validation. Not set on job submission. Provides reproducibility of the exact data
  state used for this evaluation run.
example: a3f9c12e8b4d6f1c2e9a7b3d5f0e8c4a2b6d9e1f
