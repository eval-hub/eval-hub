type: object
title: HardwareProfileRef
description: >
  Reference to an OpenDataHub HardwareProfile custom resource in the platform
  namespace (`EVALHUB_HARDWARE_PROFILES_NAMESPACE`, typically `opendatahub` or
  `redhat-ods-applications`).
required:
  - name
properties:
  name:
    type: string
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
    description: >
      Name of the `HardwareProfile` custom resource
      (`hardwareprofiles.infrastructure.opendatahub.io`). Must conform to
      RFC 1123 DNS label naming (lowercase letters, digits, and internal hyphens).
    examples:
      - default-profile
      - gpu-profile-v1
