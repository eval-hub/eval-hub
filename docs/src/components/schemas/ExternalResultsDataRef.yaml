    properties:
      data_config:
        $ref: ./ResultsDataConfig.yaml
      s3:
        $ref: ./TestDataRefS3.yaml
    required:
      - s3
    additionalProperties: false
    title: S3
  - type: object
    properties:
      data_config:
        $ref: ./ResultsDataConfig.yaml
      pvc:
        $ref: ./TestDataRefPVC.yaml
    required:
      - pvc
    additionalProperties: false
    title: PVC
  - type: object
    properties:
      data_config:
        $ref: ./ResultsDataConfig.yaml
      git:
        $ref: ./TestDataRefGit.yaml
    required:
      - git
    additionalProperties: false
    title: Git
  - type: object
    properties:
      data_config:
        $ref: ./ResultsDataConfig.yaml
      hf:
        $ref: ./TestDataRefHF.yaml
    required:
      - hf
    additionalProperties: false
    title: HuggingFace
  - $ref: ./MLflowDataRef.yaml
  - $ref: ./OCIDataRef.yaml
