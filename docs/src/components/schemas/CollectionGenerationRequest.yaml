type: object
title: CollectionGenerationRequest
description: |
  Goal and search options for a dry-run collection proposal. The service trims
  the goal and normalizes the options before persisting the generation job.
  The caller supplies the generator model's name and endpoint using the same
  model shape as an evaluation job. When authentication is needed, auth.secret_ref
  names a Secret in the tenant namespace; do not include credentials in this request.
required:
  - evaluation_goal
  - model
properties:
  evaluation_goal:
    type: string
    minLength: 1
    maxLength: 10000
    pattern: '\S'
    description: Non-blank natural-language evaluation goal, up to 10000 characters; leading and trailing whitespace is trimmed.
  model:
    description: >
      Model that generates the proposal, distinct from any future evaluation
      target or guardrail model. Both name and url are required for generation;
      prerecorded evaluation data cannot substitute for a generator connection.
    allOf:
      - $ref: ./ModelRef.yaml
      - type: object
        required: [url]
        properties:
          url:
            type: string
            minLength: 1
  provider_filter:
    type: string
    minLength: 1
    description: Optional comma-separated provider IDs. Omit to search all providers visible to the tenant.
  max_benchmarks:
    type: integer
    minimum: 1
    maximum: 100
    default: 12
    description: Maximum number of benchmarks in the generated collection (1 to 100).
  strictness:
    type: string
    enum: [lenient, moderate, strict]
    default: moderate
    description: How conservatively the runner selects and calibrates benchmarks.
  generation_effort:
    type: string
    enum: [low, standard, high]
    default: standard
    description: >
      Requested generation-effort preset. The service maps this to server-capped
      iteration, token, and deadline budgets. It may set a model-specific
      reasoning control only when the selected model/provider supports it. Presets do
      not promise a fixed completion time and are independent of strictness.
additionalProperties: false
