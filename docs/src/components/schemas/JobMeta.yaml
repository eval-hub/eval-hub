type: object
description: |
  Job-level metadata on status events that is not part of benchmark state.
  The sidecar injects `resolved_sha` for git-source jobs; adapters must not set it.
properties:
  resolved_sha:
    type: string
    description: |
      Resolved content identity for the job's test data (e.g. git commit SHA).
      Injected by the sidecar after the init container writes `.git-metadata`.
      Eval Hub persists it onto `test_data_ref.resolved_sha` after benchmark validation.
    example: a3f9c12e8b4d6f1c2e9a7b3d5f0e8c4a2b6d9e1f
