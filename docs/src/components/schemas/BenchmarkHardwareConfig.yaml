type: object
title: BenchmarkHardwareConfig
description: >
  Optional per-benchmark hardware override for Kubernetes runtimes. When
  `hardware_profile_ref` is set, the server fetches the named OpenDataHub
  `HardwareProfile` custom resource and applies its CPU, memory, and GPU resource
  values plus optional scheduling (`spec.scheduling`) to the evaluation Job.
  Node scheduling applies `nodeSelector` and `tolerations`; Queue scheduling
  applies the Kueue LocalQueue name and optional priority class. Values missing
  from the profile fall back to the provider `runtime.k8s` configuration (and
  built-in defaults when those are unset). Disabled profiles
  (`opendatahub.io/disabled: "true"`) are rejected on create.
properties:
  hardware_profile_ref:
    $ref: ./HardwareProfileRef.yaml
