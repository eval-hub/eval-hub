type: object
title: StandaloneConfidenceIntervalConfig
description: Configuration for a standalone confidence interval computation.
properties:
  hardware_config:
    $ref: ./BenchmarkHardwareConfig.yaml
    description: Optional hardware override for the computation.
  results_data_ref:
    oneOf:
      - $ref: ./EvaluationJobDataRef.yaml
      - $ref: ./ExternalResultsDataRef.yaml
    description: Result data reference. An evaluation job is supported only for result data.
  calibration_data_ref:
    type: array
    minItems: 1
    items:
      $ref: ./TestDataRef.yaml
    description: References to the labeled calibration data used by the computation.
  significance_level:
    type: number
    format: float
    exclusiveMinimum: 0
    exclusiveMaximum: 1
    description: Significance level alpha; 0.7 produces a 30% confidence interval.
required:
  - results_data_ref
  - calibration_data_ref
  - significance_level
additionalProperties: false
