type: object
title: StandaloneConfidenceIntervalConfig
description: Configuration for a standalone confidence interval computation.
allOf:
  - $ref: ./ConfidenceIntervalConfigCommon.yaml
  - type: object
    properties:
      results_data_ref:
        $ref: ./ExternalResultsDataRef.yaml
      primary_score:
        allOf:
          - $ref: ./PrimaryScore.yaml
          - type: object
            required:
              - metric
    required:
      - results_data_ref
      - primary_score
    description: Standalone computations use external result references and must identify the primary score metric.
unevaluatedProperties: false
