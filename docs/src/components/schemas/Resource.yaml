type: object
description: Base resource fields
properties:
  id:
    type: string
    description: Unique identifier
  tenant:
    type: string
    description: Tenant for scoping
  created_at:
    type: string
    format: date-time
    description: Creation timestamp
  updated_at:
    type: string
    format: date-time
    description: Last update timestamp
  owner:
    type: string
    description: Owner of the resource
  version_counter:
    type: integer
    description: >
      Server-managed mutation counter for custom (tenant-scoped) collections.
      Persisted in the database; not lost on restart. Auto-incremented on every
      successful PUT or PATCH; starts at 1 on creation. Zero for resources that
      do not support versioning (system collections, evaluations, providers).
      Purpose: lets users verify that a collection definition did not change
      between two evaluation runs by comparing the version_counter field recorded on
      each job result — if both runs reference the same collection_id and version_counter,
      the collection was unchanged (R8 reproducibility).
