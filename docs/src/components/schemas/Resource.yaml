type: object
description: Base resource fields
properties:
  id:
    type: string
    description: Unique identifier
  tenant:
    type: string
    description: Tenant for scoping
  created_at:
    type: string
    format: date-time
    description: Creation timestamp
  updated_at:
    type: string
    format: date-time
    description: Last update timestamp
  owner:
    type: string
    description: Owner of the resource
  version:
    type: integer
    description: >
      Monotonic version counter, auto-incremented by the server on every successful
      PUT or PATCH regardless of which fields changed. Starts at 1.
      Lets consumers detect any mutation and lets evaluation jobs record
      which version of the collection they ran against (R8 reproducibility).
