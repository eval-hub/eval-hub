type: object
description: Base resource fields
properties:
  id:
    type: string
    description: Unique identifier
  tenant:
    type: string
    description: Tenant for scoping
  created_at:
    type: string
    format: date-time
    description: Creation timestamp
  updated_at:
    type: string
    format: date-time
    description: Last update timestamp
  owner:
    type: string
    description: Owner of the resource
  version_counter:
    type: integer
    description: >
      Server-managed mutation counter for custom (tenant-scoped) collections.
      Auto-incremented on every successful PUT or PATCH; starts at 1 on creation.

      Sentinel values:
        0 — pre-versioning mechanism, or resource type that does not support versioning
            (e.g. system collections, evaluations, providers).
       >0 — valid version counter.
