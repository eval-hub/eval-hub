type: object
description: Base resource fields
properties:
  id:
    type: string
    description: Unique identifier
  tenant:
    type: string
    description: Tenant for scoping
  created_at:
    type: string
    format: date-time
    description: Creation timestamp
  updated_at:
    type: string
    format: date-time
    description: Last update timestamp
  owner:
    type: string
    description: Owner of the resource
  version_counter:
    type: integer
    description: >
      Server-managed mutation counter for custom (tenant-scoped) collections.
      Persisted in the database as part of the JSON entity blob — no schema
      migration is required when this field is introduced. Auto-incremented on
      every successful PUT or PATCH; starts at 1 on creation.

      Backward compatibility: resources created before version tracking was
      introduced will return version_counter = 0 (field absent in stored JSON
      deserializes to zero). Zero is a sentinel meaning "pre-versioning era" —
      no history is available for these resources.

      Sentinel values:
        0 — pre-versioning era, or resource type that does not support versioning
            (system collections, evaluations, providers).
       >0 — valid version counter. Two evaluation runs that reference the same
            collection_id and version_counter used an identical collection definition
            (R8 reproducibility).

      Zero for resources that do not support versioning: system collections,
      evaluations, providers.
