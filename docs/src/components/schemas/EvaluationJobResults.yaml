type: object
description: >-
  Results section shared by create, get, and list job resources. Unavailable OCI
  outputs are omitted. A signing request alone does not produce OCI processing
  status or signing results.
examples:
  - benchmarks: []
properties:
  oci:
    $ref: ./EvaluationOCIResults.yaml
    description: Optional job-level OCI reporting; omitted until values are available, including on completed jobs.
  benchmarks:
    type: array
    items:
      $ref: ./BenchmarkResult.yaml
    description: Per-benchmark results
  mlflow_experiment_url:
    type: string
    description: URL to MLFlow experiment
  test:
    $ref: ./EvaluationTest.yaml
    description: Test result
  post_processing_ref:
    $ref: ./PostProcessingRef.yaml
    description: Reference to the post-processing resource for this evaluation job
