type: object
description: >
  A durable display-only result snapshot for a curated collection.
  Scores are copied from the source evaluation job at promotion time and do not
  depend on the originating job remaining in the database.
properties:
  label:
    type: string
    description: Display label for this result (e.g. "RAG Eval Run #14").
  model_name:
    type: string
    description: Name of the model that produced this result.
  date:
    type: string
    format: date-time
    description: RFC3339 timestamp when this result was produced.
  scores:
    type: object
    additionalProperties:
      type: number
      format: float
    description: Map of metric name to score value.
  overall:
    type: number
    format: float
    description: Weighted aggregate score across all benchmarks.
  passed:
    type: boolean
    description: True if the overall score meets the collection pass_criteria threshold.
  eval_card_ref:
    $ref: ./EvalCardRef.yaml
    description: >
      Optional reference to the full EvalCard artifact for this result.
      Populated once EvalCard storage is resolved; static score fields above
      are always used for display regardless.
required:
  - label
  - model_name
  - date
  - scores
  - overall
  - passed
