type: object
title: EvaluationJobDataRef
description: Reference to a completed evaluation job whose stored results are consumed.
properties:
  eval_job:
    type: object
    description: Evaluation job identifier and benchmark processing options.
    properties:
      id:
        type: string
        description: Evaluation job identifier.
      num_parallel_threads:
        type: integer
        minimum: 1
        default: 1
        description: Number of benchmark confidence interval computations to run in parallel; 1 runs them sequentially.
    required:
      - id
    additionalProperties: false
required:
  - eval_job
additionalProperties: false
