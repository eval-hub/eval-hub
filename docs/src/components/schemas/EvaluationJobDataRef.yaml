type: object
title: EvaluationJobDataRef
description: Reference to a completed evaluation job whose stored results are consumed.
properties:
  eval_job:
    type: object
    description: Evaluation job identifier and benchmark processing options.
    properties:
      id:
        type: string
        description: Evaluation job identifier.
      process_benchmarks_in_parallel:
        type: boolean
        default: false
        description: Whether confidence intervals for the job's benchmarks may run in parallel.
    required:
      - id
    additionalProperties: false
required:
  - eval_job
additionalProperties: false
