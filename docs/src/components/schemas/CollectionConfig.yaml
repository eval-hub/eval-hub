type: object
description: Request to create or update a collection.
properties:
  name:
    type: string
    description: Collection name.
  category:
    type: string
    description: >
      Broad evaluation domain. Known values align with the enterprise LLM quality taxonomy:
      knowledge_reasoning, document_understanding, instruction_output, tool_use,
      software, trustworthiness, multilingual, multimodal.
  description:
    type: string
    description: Optional description.
  tags:
    type: array
    items:
      type: string
    description: Tags.
  custom:
    type: object
    additionalProperties: true
    description: Custom key-value data.
  pass_criteria:
    $ref: ./PassCriteria.yaml
    description: Pass criteria for the collection.
  benchmarks:
    type: array
    items:
      $ref: ./CollectionBenchmarkConfig.yaml
    description: Benchmarks in the collection.
  modalities:
    type: array
    items:
      type: string
    description: >
      Data modalities this collection covers. Values use snake_case matching the category
      convention. Known values: text, vision, multimodal.
  tasks:
    type: array
    items:
      type: string
    description: >
      Evaluation subtasks covered within the collection's domain. Values use snake_case
      matching the category convention. Known values: reasoning, data_analysis, extraction,
      summarization, full_document_qa, long_context_understanding, rag,
      citation_attribution, grounding_discipline, instruction_following, structured_output,
      constraint_following, call_generation, code_generation, code_understanding, code_repair,
      safety, calibration, abstention, adversarial_injection, translation,
      document_chart_vqa, general_visual_reasoning. A collection may cover more than one subtask.
required:
  - name
  - category
  - benchmarks
