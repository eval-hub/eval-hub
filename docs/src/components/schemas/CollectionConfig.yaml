type: object
description: Request to create or update a collection.
properties:
  name:
    type: string
    description: Collection name.
  category:
    type: string
    description: >
      Broad evaluation domain. Known values align with the enterprise LLM quality taxonomy:
      knowledge_reasoning, document_understanding, instruction_output, tool_use,
      software, trustworthiness, multilingual, multimodal.
  description:
    type: string
    description: Optional description.
  tags:
    type: array
    items:
      type: string
    description: Tags.
  custom:
    type: object
    additionalProperties: true
    description: Custom key-value data.
  pass_criteria:
    $ref: ./PassCriteria.yaml
    description: Pass criteria for the collection.
  benchmarks:
    type: array
    items:
      $ref: ./CollectionBenchmarkConfig.yaml
    description: Benchmarks in the collection.
  modalities:
    type: array
    items:
      type: string
    description: Data modalities this collection covers (e.g. ["Text", "Vision"]).
  tasks:
    type: array
    items:
      type: string
    description: >
      Evaluation subtasks covered within the collection's domain. Known values align with
      the enterprise LLM quality taxonomy subtasks, e.g.: Reasoning, Data Analysis,
      Extraction, Summarization, Full-document QA, Long-context Understanding, RAG,
      Citation/Attribution, Grounding Discipline, Instruction Following, Structured Output,
      Constraint Following, Call Generation, Code Generation, Safety, Abstention,
      Adversarial/Injection Resistance, Translation, Document/Chart VQA, General Visual
      Reasoning. A collection may cover more than one subtask.
  clone_from_id:
    type: string
    description: >
      When provided on collection creation, records this collection's origin
      by setting clone_of_id in the returned state. The collection is created
      from the provided request body spec as usual; this field only affects
      provenance tracking.
required:
  - name
  - category
  - benchmarks
