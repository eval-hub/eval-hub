type: object
description: |
  Git repository test data. Only applies when Eval Hub runs the benchmark as a
  **Kubernetes Job** (cluster execution). It does not apply to local-only evaluation runs.

  The repository is cloned and checked out at **`ref`** into **`/test_data`** before
  the adapter runs. If **`sub_path`** is provided, only that subdirectory is exposed.

  The resolved commit SHA is recorded as **`resolved_sha`** on the parent
  **`test_data_ref`** object on the evaluation job response, providing commit-level
  reproducibility.

  **Public repositories** — omit `secret_ref`; the repository may be cloned over
  HTTP or HTTPS without credentials.

  **Private repositories** — supply a **`secret_ref`** and an **`https://`** URL
  pointing to a Kubernetes Secret of type `kubernetes.io/basic-auth` in the same
  namespace as the evaluation job:

  ```yaml
  apiVersion: v1
  kind: Secret
  metadata:
    name: my-git-credentials
  type: kubernetes.io/basic-auth
  stringData:
    username: my-username
    password: ghp_xxxxxxxxxxxx  # Personal Access Token or password
  ```

  Do not put credentials in the Eval Hub API request body; only reference an existing
  Secret via **`secret_ref`**.
required:
  - url
  - ref
properties:
  url:
    type: string
    description: |
      HTTP(S) URL of the git repository to clone. SSH URLs are not supported.
      Plain `http://` is allowed only for unauthenticated clones; when **`secret_ref`**
      is set the URL must use **`https://`**.
    example: https://github.com/my-org/my-eval-datasets.git
  ref:
    type: string
    description: |
      Git ref to check out — a branch name, tag name, or full commit SHA.
      The init container resolves whichever type is provided; no `type` field is needed.

      - **Branch**: `main`, `feat/my-branch`
      - **Tag**: `v1.2.0`, `release-3.6`
      - **Commit SHA**: `a3f9c12e8b...` (7–40 hex characters)
    example: main
  sub_path:
    type: string
    description: |
      Optional path within the cloned repository to mount at `/test_data` instead of
      the repository root. Useful when the repository contains data for multiple
      benchmarks in separate directories.
    example: datasets/lm-eval
  secret_ref:
    type: string
    description: |
      Name of a Kubernetes **`Secret`** of type `kubernetes.io/basic-auth` in the
      evaluation job namespace, mounted read-only into the git-clone init container.
      Omit for public repositories.
    example: my-git-credentials
example:
  url: https://github.com/my-org/my-eval-datasets.git
  ref: main
  sub_path: datasets/lm-eval
  secret_ref: my-git-credentials
