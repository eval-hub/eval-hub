type: object
description: >-
  OCI export configuration for local and Kubernetes evaluation jobs. Signing
  configuration is retained only; accepting it does not perform or schedule signing.
  Completed and partially_failed jobs publish an evaluation card and a final index
  containing recorded completed benchmark artifacts. Adapters use their own fallback
  tags; the job-level prefix is reserved for the final index.
examples:
  - coordinates:
      oci_host: quay.io
      oci_repository: my-org/eval-results
  - coordinates:
      oci_host: quay.io
      oci_repository: my-org/eval-results
      oci_tag: final
    k8s:
      connection: my-oci-secret
    signing:
      type: key-pair
      secret_ref: my-cosign-secret
properties:
  coordinates:
    $ref: ./OCICoordinates.yaml
    description: >-
      OCI export destination. The optional oci_tag reserves the evaluation-bundle
      prefix: the final index tag is <oci_tag>-<job-id>, or <job-id> when omitted
      or empty. Evaluation cards use evaluation-card-<job-id> independently.
      Invalid prefix characters are rejected before job creation. Long prefixes are
      truncated during publication to preserve the full job ID within 128 characters.
    properties:
      oci_tag:
        type: string
        pattern: '^$|^[a-zA-Z0-9_][a-zA-Z0-9._-]*$'
        description: >-
          Optional evaluation-bundle tag prefix. Nonempty values start with an
          ASCII letter, digit, or underscore and contain only ASCII letters,
          digits, underscores, dots, and hyphens. Prefixes have no maximum input length. The published prefix is truncated
          to 128 minus one separator minus the job ID length (currently 91
          characters for UUIDs). The original prefix remains in the job configuration.
        examples:
          - final
  k8s:
    $ref: ./OCIConnectionConfig.yaml
    description: Optional Kubernetes connection for OCI registry authentication
  signing:
    $ref: ./OCISigningConfig.yaml
    description: Optional signing configuration. Signing is disabled when omitted.
required:
  - coordinates
additionalProperties: false
title: EvaluationExportsOCI
