type: object
description: >
  Server-managed runtime state for custom (tenant-scoped) collections.
  Never user-supplied and never written to YAML configuration.
properties:
  clone_of_id:
    type: string
    description: >
      ID of the collection this was cloned from. Set by the server when a
      collection is created with clone_from_id.
  run_count:
    type: integer
    description: >
      Number of evaluation jobs created from this collection by its owning tenant.
      Per-tenant counter, incremented at job creation.
  example_results:
    type: array
    items:
      $ref: ./ExampleResult.yaml
    description: >
      Result snapshots promoted by the tenant as featured examples.
      Scores are copied from the source job at promotion time — durable,
      survives job deletion.
