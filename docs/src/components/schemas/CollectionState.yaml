type: object
description: >
  Server-managed runtime state for curated collections.
  Never user-supplied and never written to YAML configuration.
  Present only on collections that are part of the Curated Collections feature.
properties:
  clone_of_id:
    type: string
    description: >
      ID of the collection this was cloned from. Set by the server when a
      collection is created with clone_from_id; never user-supplied.
      Provides provenance so the UI can show "forked from <name>".
  run_count:
    type: integer
    description: >
      Number of evaluation jobs created from this collection by its owning tenant.
      Per-tenant counter incremented at job creation.
  benchmark_count:
    type: integer
    description: Number of benchmarks in this collection, denormalized for display. Populated and updated by the server.
  dataset_count:
    type: integer
    description: Number of datasets associated with this collection, denormalized for display. Populated and updated by the server.
  example_results:
    type: array
    items:
      $ref: ./ExampleResult.yaml
    description: >
      Result snapshots promoted by the tenant as featured examples.
      Scores are copied from the source job at promotion time — durable,
      survives job deletion. Populated via PATCH /collections/{id}.
