type: object
description: >
  The collection to use for the evaluation job.
required:
  - id
properties:
  id:
    type: string
    description: >
      The unique identifier of the collection.
  version_counter:
    type: integer
    description: >
      The version_counter of the collection at the time this evaluation job was created.
      Set by the server when the job is created; not accepted from the client.
      Lets users verify whether the collection definition was the same across multiple
      evaluation runs: if two jobs reference the same collection id and version_counter,
      the collection was unchanged between those runs (R8 reproducibility).
  benchmarks:
    type: array
    items:
      $ref: ./EvaluationBenchmarkConfig.yaml
    description: >
      The benchmarks supported by this collection. If a benchmark is specified
      but is not supported by the collection, the evaluation job will fail. This is needed
      in order to allow overriding the collection benchmarks for a specific evaluation job.
