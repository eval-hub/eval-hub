type: object
description: >
  The collection to use for the evaluation job.
required:
  - id
properties:
  id:
    type: string
    description: >
      The unique identifier of the collection.
  collection_updated_at:
    type: string
    format: date-time
    description: >
      The collection's updated_at timestamp at the moment this evaluation job was created.
      Set by the server; not accepted from the client.
      Compare against the current collection's updated_at to detect post-creation changes:
      if the current updated_at is later, the collection definition has changed since
      the job was created. Absent for jobs created before this field was introduced.

      Limitation: this field provides weaker guarantees than a revision counter.
      Two mutations within the same DB timestamp resolution may produce identical values,
      making them indistinguishable.
  benchmarks:
    type: array
    items:
      $ref: ./EvaluationBenchmarkConfig.yaml
    description: >
      The benchmarks supported by this collection. If a benchmark is specified
      but is not supported by the collection, the evaluation job will fail. This is needed
      in order to allow overriding the collection benchmarks for a specific evaluation job.
