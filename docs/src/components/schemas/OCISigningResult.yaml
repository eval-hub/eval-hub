type: object
description: >-
  Signing information associated with the evaluation bundle digest.
  Signing is pending implementation, so this object is currently omitted. Omit until
  an actual signing outcome is available. Processing status is reported separately
  in results.oci.status; it does not change the evaluation job status.
properties:
  type:
    type: string
    enum: [key-pair]
    description: Signing method. Only key-pair is accepted by the schema; signing is pending implementation.
required:
  - type
additionalProperties: false
