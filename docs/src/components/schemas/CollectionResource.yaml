type: object
description: Collection resource
allOf:
  - type: object
    properties:
      resource:
        $ref: ./Resource.yaml
        description: Resource metadata
      state:
        $ref: ./CollectionState.yaml
        description: >
          Server-managed runtime state for custom (tenant-scoped) collections.
          Present only on collections with scope=tenant; absent on curated system
          collections. Never user-supplied.
      curated:
        $ref: ./CollectionCuratedMetadata.yaml
        description: >
          Display metadata for curated collections.
          Set by system operators via YAML configuration only; not accepted
          in request bodies. Present only on curated collections.
  - $ref: ./CollectionConfig.yaml
