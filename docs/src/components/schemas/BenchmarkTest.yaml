type: object
description: The test result of a single benchmark run
properties:
  primary_score:
    type: number
    format: float
    description: Primary score value
  primary_score_metric:
    type: string
    description: Name of the metric used as the primary score
  lower_is_better:
    type: boolean
    description: >
      Direction of the selected primary metric (from job, completed status event,
      or provider catalog). Used when aggregating the job-level score so
      event-reported lower-is-better metrics are inverted consistently.
  threshold:
    type: number
    format: float
    description: Threshold value
  pass:
    type: boolean
    description: Whether the benchmark passed
