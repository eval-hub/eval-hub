type: object
description: Model specification for evaluation requests
required:
  - name
properties:
  url:
    type: string
    description: |
      The model URL.

      Note that if `pre_recorded_data` is set for all `test_data_ref.type`
      in the `benchmarks` section then `url` will not be `required` for the job run,
      in all other cases a `url` is required.
  name:
    type: string
    description: >
      The model name.
  parameters:
    type: object
    additionalProperties: true
    description: >
      The model specific parameters.
  auth:
    $ref: ./ModelAuth.yaml
    description: >
      The model authentication configuration.
