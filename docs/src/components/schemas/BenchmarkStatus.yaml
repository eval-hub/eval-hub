type: object
description: Status of an individual benchmark in an evaluation
properties:
  provider_id:
    type: string
    description: Provider ID
  id:
    type: string
    description: Benchmark ID
  benchmark_index:
    type: integer
    description: Benchmark index in the evaluation job request
  status:
    $ref: ./State.yaml
  phase:
    $ref: ./JobPhase.yaml
  error_message:
    $ref: ./MessageInfo.yaml
  warning_message:
    $ref: ./MessageInfo.yaml
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: >
      Server-managed RFC3339 creation time, set from the service's current time
      when the evaluation job is created, before runtime execution. Set for
      every benchmark, including benchmarks that never start, and preserved
      across subsequent status events. Independent of the evaluation job's
      database-generated resource.created_at. For older jobs missing benchmark
      creation metadata, populated on the first accepted benchmark status event.
  updated_at:
    type: string
    format: date-time
    readOnly: true
    description: >
      Server-managed RFC3339 time of the most recent accepted update to this
      benchmark, including pending events. Updates to other benchmarks do not
      change this timestamp.
  started_at:
    type: string
    format: date-time
    readOnly: true
    description: >
      RFC3339 start time selected by the first accepted running status event.
      Uses that event's started_at when provided, otherwise the time eval-hub
      received the request. Omitted until a running event is accepted, including
      when a benchmark terminates before reporting running. Never replaced by
      timestamps on subsequent status events, retries, or pod restarts. Runtime
      timestamps are preserved as supplied, so clock differences may affect
      ordering relative to server-managed timestamps.
  completed_at:
    type: string
    format: date-time
    description: >
      RFC3339 time the benchmark finished successfully, failed, or was cancelled.
      Omitted until the benchmark reaches a terminal state. Uses the runtime's
      completion time when supplied, otherwise the server time. Preserved
      across subsequent status events.
