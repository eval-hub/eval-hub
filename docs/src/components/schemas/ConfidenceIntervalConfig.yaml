type: object
title: ConfidenceIntervalConfig
description: Configuration for confidence interval post-processing on an evaluation job.
properties:
  num_parallel_threads:
    type: integer
    minimum: 1
    default: 1
    description: Number of benchmark confidence interval computations to run in parallel; 1 runs them sequentially.
  hardware_config:
    $ref: ./BenchmarkHardwareConfig.yaml
    description: Optional hardware override for confidence interval computation.
  calibration_data_ref:
    $ref: ./TestDataRef.yaml
    description: Reference to the labeled calibration data used by the computation.
  significance_level:
    type: number
    format: float
    exclusiveMinimum: 0
    exclusiveMaximum: 1
    description: Significance level alpha. For example, 0.7 requests a 30% confidence interval.
required:
  - calibration_data_ref
  - significance_level
additionalProperties: false
