type: object
title: PostProcessingResource
description: Standalone confidence interval post-processing resource.
properties:
  resource:
    $ref: ./Resource.yaml
  name:
    $ref: ./PostProcessingName.yaml
  confidence_interval_config:
    $ref: ./StandaloneConfidenceIntervalConfig.yaml
  status:
    $ref: ./PostProcessingStatus.yaml
  results:
    oneOf:
      - $ref: ./PostProcessingResultsEvalJob.yaml
      - $ref: ./PostProcessingResultsExternal.yaml
    description: Use benchmark results for eval_job data and aggregate results otherwise.
required:
  - resource
  - name
  - confidence_interval_config
  - status
additionalProperties: false
