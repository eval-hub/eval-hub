title: PostProcessingResource
description: Standalone post-processing resource.
allOf:
  - $ref: ./PostProcessingCommon.yaml
  - type: object
    properties:
      resource:
        $ref: ./Resource.yaml
      operations:
        $ref: ./StandalonePostProcessingOperations.yaml
      status:
        $ref: ./PostProcessingStatus.yaml
      results:
        oneOf:
          - $ref: ./PostProcessingResultsEvalJob.yaml
          - $ref: ./PostProcessingResultsExternal.yaml
        description: Use benchmark results for eval_job data and aggregate results otherwise.
    required:
      - resource
      - operations
      - status
unevaluatedProperties: false
