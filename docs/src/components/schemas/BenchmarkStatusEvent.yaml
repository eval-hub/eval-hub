type: object
description: Event payload to update benchmark status at runtime
required:
  - provider_id
  - id
  - status
properties:
  provider_id:
    type: string
    description: Provider ID
  id:
    type: string
    description: Benchmark ID
  benchmark_index:
    type: integer
    description: Benchmark index in the evaluation job request
  status:
    $ref: ./State.yaml
  phase:
    $ref: ./JobPhase.yaml
  metrics:
    type: object
    additionalProperties: true
    description: >
      Metrics reported by the evaluation adapter for this benchmark, keyed by
      metric name. Each value may be a scalar, list, or object.
    example:
      accuracy: 0.95
      toxicity_score: 0.12
  metrics_schema:
    type: array
    description: >
      Optional metadata describing how each metric in metrics should be
      interpreted. Each entry names a metric key and its result type. Metrics
      without an entry default to numeric.
    example:
      - name: accuracy
        type: numeric
      - name: toxicity_score
        type: numeric
    items:
      $ref: ./MetricSchema.yaml
  additional_info:
    type: object
    additionalProperties: true
    description: Additional benchmark information
  artifacts:
    type: object
    additionalProperties: true
    description: Artifacts
  error_message:
    $ref: ./MessageInfo.yaml
  warning_message:
    $ref: ./MessageInfo.yaml
  started_at:
    type: string
    format: date-time
  completed_at:
    type: string
    format: date-time
  mlflow_run_id:
    type: string
    description: MLFlow run ID
  logs_path:
    type: string
    description: Path to logs
  job_meta:
    $ref: ./JobMeta.yaml
