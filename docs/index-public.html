quantities for a benchmark's direct `hardware_config` override.\n","properties":{"request":{"type":"string","description":"Kubernetes resource request quantity (for example `1`, `250m`, or `1Gi`).\n","examples":["1","250m","1Gi"]},"limit":{"type":"string","description":"Kubernetes resource limit quantity (for example `2`, `1`, or `2Gi`).\n","examples":["2","1","2Gi"]}}},"HardwareGPUConfig":{"type":"object","title":"HardwareGPUConfig","description":"Optional GPU resource override for a benchmark's direct `hardware_config`. Kubernetes sets GPU requests and limits to the same value (`count`). Mutually exclusive with `dra` — a request that sets both is rejected.\n","properties":{"name":{"type":"string","description":"Kubernetes extended resource name (for example `nvidia.com/gpu` or `amd.com/gpu`).\n","examples":["nvidia.com/gpu"]},"count":{"type":"integer","minimum":1,"description":"Number of GPU units to request on the evaluation Job. Applied as both request and limit.\n","examples":[1]}}},"HardwareDRAConfig":{"type":"object","title":"HardwareDRAConfig","description":"Optional Dynamic Resource Allocation (DRA) override for a benchmark's direct `hardware_config`. Accelerators are requested by referencing a ResourceClaimTemplate that already exists in the job's namespace; the template, not this object, defines the device class, attribute selectors, and topology constraints. Mutually exclusive with `gpu` — a request that sets both is rejected. Template references (rather than pre-created ResourceClaims) keep evaluation Jobs admissible to Kueue, which only accepts workload objects that create their own claims.\n","required":["resource_claim_template"],"properties":{"resource_claim_template":{"type":"string","maxLength":63,"pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$","description":"Name of the ResourceClaimTemplate in the job's namespace. Must conform to RFC 1123 DNS label naming. The referenced template defines the device requests (device class, attributes, topology).\n","examples":["gpu-claim-template"]},"claim_name":{"type":"string","maxLength":63,"pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$","description":"Pod-local claim name the adapter container references via `resources.claims`. Defaults to `gpu` when omitted.\n","examples":["gpu"]}}},"BenchmarkHardwareConfig":{"type":"object","title":"BenchmarkHardwareConfig","description":"Optional per-benchmark hardware override for Kubernetes runtimes.\nTwo mutually exclusive modes:\n- **Profile mode:** set `hardware_profile_name` to fetch a named OpenDataHub\n  `HardwareProfile` custom resource and apply its CPU, memory, and GPU resource\n  values plus optional scheduling (`spec.scheduling`) to the evaluation Job.\n  Node scheduling applies `nodeSelector` and `tolerations`; Queue scheduling\n  applies the Kueue LocalQueue name and optional priority class. When\n  `hardware_profile_name` is set, `queue`, `cpu`, `memory`, `gpu`, and `dra`\n  must not be present — the request is rejected. Disabled profiles\n  (`opendatahub.io/disabled: \"true\"`) are rejected on create.\n\n- **Direct mode:** omit `hardware_profile_name` and set `queue`, `cpu`,\n  `memory`, `gpu`, and/or `dra` directly. Values missing from these fields\n  fall back to the provider `runtime.k8s` configuration (and built-in\n  defaults when those are unset). `gpu` (legacy extended resource) and\n  `dra` (ResourceClaimTemplate reference) are mutually exclusive with each\n  other; an explicit request-level choice of either overrides the provider\n  default for the other mechanism.\n","properties":{"hardware_profile_name":{"type":"string","maxLength":63,"pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$","description":"Name of the OpenDataHub `HardwareProfile` custom resource (`hardwareprofiles.infrastructure.opendatahub.io`) in the platform namespace (`EVALHUB_HARDWARE_PROFILES_NAMESPACE`, typically `opendatahub` or `redhat-ods-applications`). Must conform to RFC 1123 DNS label naming (lowercase letters, digits, and internal hyphens; max 63 characters). Mutually exclusive with `queue`, `cpu`, `memory`, `gpu`, and `dra`.\n","examples":["default-profile","gpu-profile-v1"]},"queue":{"$ref":"#/components/schemas/QueueConfig"},"cpu":{"$ref":"#/components/schemas/HardwareResourceQuantity"},"memory":{"$ref":"#/components/schemas/HardwareResourceQuantity"},"gpu":{"$ref":"#/components/schemas/HardwareGPUConfig"},"dra":{"$ref":"#/components/schemas/HardwareDRAConfig"}}},"TestDataRefS3":{"type":"object","description":"S3 (or S3-compatible) test data. Only applies when Eval Hub runs the benchmark as a\n**Kubernetes Job** (cluster execution). It does not apply to local-only evaluation runs.\n\nThe test-data **init container** loads the Secret named **`secret_ref`** from the\njob namespace. It expects these keys. **All values must be non-empty** or the init\ncontainer fails:\n\n- **`AWS_ACCESS_KEY_ID`** — access key\n- **`AWS_SECRET_ACCESS_KEY`** — secret key\n- **`AWS_DEFAULT_REGION`** — region used for signing (for example `us-east-1`)\n- **`AWS_S3_ENDPOINT`** — base URL of the S3 API (AWS regional endpoint or your\n  S3-compatible gateway)\n\nThese align with Secrets commonly produced by ODH/RHOAI when an S3 connection is created.\n","required":["bucket","key","secret_ref"],"properties":{"bucket":{"type":"string","description":"S3 bucket name."},"key":{"type":"string","description":"Object key or prefix within the bucket. Leading and trailing slashes are\nnormalized. The init container lists objects under this prefix and downloads\neach into **`/test_data`**, keeping subdirectory structure relative to the prefix.\n"},"secret_ref":{"type":"string","description":"Name of a Kubernetes **`Secret`** in the evaluation job namespace, mounted\nread-only into the test-data init container.\n"}},"examples":[{"bucket":"my-eval-bucket","key":"datasets/benchmark-a/v1","secret_ref":"my-s3-connection-secret"}]},"TestDataRefResolvedSHA":{"type":"string","readOnly":true,"description":"Resolved content identity for the test data source (e.g. git or Hugging Face commit SHA).\nServer-populated after the evaluation run for reproducibility of the exact data\nstate used. Not set on job submission.\n","examples":["a3f9c12e8b4d6f1c2e9a7b3d5f0e8c4a2b6d9e1f"]},"TestDataRefType":{"type":"string","description":"The type of test data being referenced, the default is `data_set` if not specified. The `model` section remains required for all job runs; however, if `pre_recorded_data` is set for all benchmarks then `model.url` may be omitted.\n","enum":["data_set","pre_recorded_data"],"default":"data_set"},"TestDataRefPVC":{"type":"object","description":"PersistentVolumeClaim (PVC) test data. Only applies when Eval Hub runs the benchmark as a\n**Kubernetes Job** (cluster execution). It does not apply to local-only evaluation runs.\n\nThe PVC is mounted **read-only** directly into the evaluation container at **`/test_data`**.\nNo init container is scheduled — the data must already reside on the PVC before job submission.\n\n**Requirements:**\n- The PersistentVolumeClaim named by **`claim_name`** must already exist in the **same namespace**\n  as the evaluation job.\n- Eval Hub does not create, provision, or manage the PVC — this is the tenant's responsibility.\n- The evaluation adapter reads data from `/test_data` identically to S3-backed jobs.\n","required":["claim_name"],"properties":{"claim_name":{"type":"string","maxLength":63,"pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$","description":"Name of the PersistentVolumeClaim in the evaluation job namespace (same as Kubernetes\n`PersistentVolumeClaimVolumeSource.claimName`). Must be a valid RFC 1123 DNS label\n(lowercase letters, digits, and internal hyphens; max 63 characters).\n"},"sub_path":{"type":"string","description":"Optional path within the PVC to mount at `/test_data` instead of the PVC root.\nUseful when a single PVC contains data for multiple benchmarks in separate directories.\n"}},"examples":[{"claim_name":"eval-datasets-pvc","sub_path":"benchmark-a/v1"}]},"TestDataRefGit":{"type":"object","description":"Git repository test data. Only applies when Eval Hub runs the benchmark as a\n**Kubernetes Job** (cluster execution). It does not apply to local-only evaluation runs.\n\nThe repository is cloned and checked out at **`ref`** into **`/test_data`** before\nthe adapter runs. If **`sub_path`** is provided, only that subdirectory is exposed.\n\nThe resolved commit SHA is recorded as **`resolved_sha`** on the parent\n**`test_data_ref`** object on the evaluation job response, providing commit-level\nreproducibility.\n\n**Public repositories** — omit `secret_ref`; the repository may be cloned over\nHTTP or HTTPS without credentials.\n\n**Private repositories** — supply a **`secret_ref`** and an **`https://`** URL\npointing to a Kubernetes Secret of type `kubernetes.io/basic-auth` in the same\nnamespace as the evaluation job:\n\n```yaml\napiVersion: v1\nkind: Secret\nmetadata:\n  name: my-git-credentials\ntype: kubernetes.io/basic-auth\nstringData:\n  username: my-username\n  password: ghp_xxxxxxxxxxxx  # Personal Access Token or password\n```\n\nDo not put credentials in the Eval Hub API request body; only reference an existing\nSecret via **`secret_ref`**.\n","required":["url","ref"],"properties":{"url":{"type":"string","description":"HTTP(S) URL of the git repository to clone. SSH URLs are not supported.\nPlain `http://` is allowed only for unauthenticated clones; when **`secret_ref`**\nis set the URL must use **`https://`**.\n","examples":["https://github.com/my-org/my-eval-datasets.git"]},"ref":{"type":"string","description":"Git ref to check out — a branch name, tag name, or full commit SHA.\nThe init container resolves whichever type is provided; no `type` field is needed.\n\n- **Branch**: `main`, `feat/my-branch`\n- **Tag**: `v1.2.0`, `release-3.6`\n- **Commit SHA**: `a3f9c12e8b...` (7–40 hex characters)\n","examples":["main"]},"sub_path":{"type":"string","description":"Optional path within the cloned repository to mount at `/test_data` instead of\nthe repository root. Useful when the repository contains data for multiple\nbenchmarks in separate directories.\n","examples":["datasets/lm-eval"]},"secret_ref":{"type":"string","description":"Name of a Kubernetes **`Secret`** of type `kubernetes.io/basic-auth` in the\nevaluation job namespace, mounted read-only into the git-clone init container.\nOmit for public repositories.\n","examples":["my-git-credentials"]}},"examples":[{"url":"https://github.com/my-org/my-eval-datasets.git","ref":"main","sub_path":"datasets/lm-eval","secret_ref":"my-git-credentials"}]},"TestDataRefHF":{"type":"object","description":"Hugging Face Hub repository test data. Only applies when Eval Hub runs the benchmark as a\n**Kubernetes Job** (cluster execution). It does not apply to local-only evaluation runs.\n\nThe repository is downloaded at **`revision`** (or the default branch when omitted) into\n**`/test_data`** before the adapter runs. If **`sub_path`** is provided, only that path\nwithin the repository is exposed.\n\nThe resolved commit SHA is recorded as **`resolved_sha`** on the parent\n**`test_data_ref`** object on the evaluation job response, providing revision-level\nreproducibility.\n\n**Public repositories** — omit `secret_ref`; the repository may be downloaded without\ncredentials.\n\n**Gated repositories** — supply a **`secret_ref`** pointing to a Kubernetes Secret of type\n`Opaque` in the same namespace as the evaluation job:\n\n```yaml\napiVersion: v1\nkind: Secret\nmetadata:\n  name: my-hf-credentials\ntype: Opaque\nstringData:\n  token: hf_xxxxxxxxxxxx\n```\n\nDo not put credentials in the Eval Hub API request body; only reference an existing\nSecret via **`secret_ref`**.\n","required":["repo_id"],"properties":{"repo_id":{"type":"string","description":"Hugging Face Hub repository ID (for example `cais/mmlu` or `my-org/my-dataset`).\n","examples":["cais/mmlu"]},"revision":{"type":"string","description":"Revision to download — a branch name, tag name, or commit SHA. When omitted, the\nrepository default branch is used.\n\n- **Branch**: `main`, `feat/my-branch`\n- **Tag**: `v1.0.0`\n- **Commit SHA**: `a3f9c12e8b...` (full or abbreviated hex)\n","examples":["main"]},"sub_path":{"type":"string","description":"Optional path within the repository to mount at `/test_data` instead of the\nrepository root. Useful when the repository contains data for multiple benchmarks\nin separate directories.\n","examples":["data/train"]},"secret_ref":{"type":"string","description":"Name of a Kubernetes **`Secret`** of type `Opaque` containing a **`token`** key in the\nevaluation job namespace, mounted read-only into the test-data init container.\nOmit for public repositories.\n","examples":["my-hf-credentials"]}},"examples":[{"repo_id":"cais/mmlu","revision":"main","sub_path":"data/train","secret_ref":"my-hf-credentials"}]},"TestDataRef":{"type":"object","description":"Reference to external test data for a benchmark. Exactly one of `s3`, `pvc`, `git`, or `hf` must be set.\n\n**`s3`** — When the evaluation runs as a **Kubernetes Job**, Eval Hub schedules an\n**init container** on the evaluation job pod before the adapter runs. That init container:\n\n- Reads **`bucket`**, **`key`**, and **`secret_ref`** from the job spec (same JSON\n  mounted into the pod).\n- Uses credentials from the Kubernetes **Secret** named by **`secret_ref`**\n  (read-only mount; typical sources include an ODH/RHOAI S3 connection Secret).\n- Lists and downloads all objects under the **`key`** prefix into a shared\n  **`emptyDir`** volume at **`/test_data`**, preserving relative paths.\n- Exits; the **adapter container** mounts `/test_data` and reads the files.\n\n**`pvc`** — The PersistentVolumeClaim is mounted **read-only** directly into the evaluation\ncontainer at **`/test_data`**. No init container is used; the PVC must already contain the\ndata and must exist in the same namespace as the evaluation job.\n\n**`git`** — The specified repository is cloned and checked out at the given ref into\n**`/test_data`** before the adapter runs. The resolved commit SHA is recorded as\n**`resolved_sha`** on this object on the evaluation job for reproducibility.\n\n**`hf`** — The specified Hugging Face Hub repository is downloaded at the given revision\ninto **`/test_data`** before the adapter runs. The resolved commit SHA is recorded as\n**`resolved_sha`** on this object on the evaluation job for reproducibility.\n\nDo not put credentials in the Eval Hub API request body; only reference an existing\nSecret via **`secret_ref`** (for S3, git, or hf).\n","oneOf":[{"type":"object","properties":{"s3":{"$ref":"#/components/schemas/TestDataRefS3"},"resolved_sha":{"$ref":"#/components/schemas/TestDataRefResolvedSHA"},"type":{"$ref":"#/components/schemas/TestDataRefType"}},"additionalProperties":false,"required":["s3"],"title":"S3"},{"type":"object","properties":{"pvc":{"$ref":"#/components/schemas/TestDataRefPVC"},"resolved_sha":{"$ref":"#/components/schemas/TestDataRefResolvedSHA"},"type":{"$ref":"#/components/schemas/TestDataRefType"}},"additionalProperties":false,"required":["pvc"],"title":"PVC"},{"type":"object","properties":{"git":{"$ref":"#/components/schemas/TestDataRefGit"},"resolved_sha":{"$ref":"#/components/schemas/TestDataRefResolvedSHA"},"type":{"$ref":"#/components/schemas/TestDataRefType"}},"additionalProperties":false,"required":["git"],"title":"Git"},{"type":"object","properties":{"hf":{"$ref":"#/components/schemas/TestDataRefHF"},"resolved_sha":{"$ref":"#/components/schemas/TestDataRefResolvedSHA"},"type":{"$ref":"#/components/schemas/TestDataRefType"}},"additionalProperties":false,"required":["hf"],"title":"HuggingFace"}]},"EvaluationBenchmarkConfig":{"type":"object","description":"Reference to a benchmark in an evaluation job (top-level benchmarks or collection override list).\nDoes not include a URL; URLs appear only on collection benchmark entries.\n","allOf":[{"$ref":"#/components/schemas/Ref"},{"type":"object","required":["provider_id"],"properties":{"provider_id":{"type":"string","description":"Evaluation provider ID."},"weight":{"type":"number","format":"float","minimum":0,"description":"Weight of this benchmark."},"primary_score":{"$ref":"#/components/schemas/PrimaryScore"},"pass_criteria":{"$ref":"#/components/schemas/PassCriteria"},"hardware_config":{"$ref":"#/components/schemas/BenchmarkHardwareConfig","description":"Optional hardware profile override for this benchmark. Kubernetes runtimes\nonly; ignored by local runtimes.\n"},"parameters":{"type":"object","additionalProperties":true,"description":"Benchmark-specific parameters. For a collection benchmark that declares\n`judge_model`, supply a non-empty judge model identifier. With no\njudge-specific entries in the Secret named by `model.auth.secret_ref`,\nthe judge reuses the target endpoint and credential. `judge_api-key`\nselects a separate credential at the target endpoint; add `judge_url`\nfor a separate endpoint. `judge_url` without `judge_api-key` is invalid.\nThis applies only to benchmarks whose collection declares `judge_model`.\n"},"test_data_ref":{"$ref":"#/components/schemas/TestDataRef","description":"Optional external test data mounted at **`/test_data`** for **Kubernetes Job** runs.\nSet **`s3`** to download objects via a pre-run init container, **`pvc`** to mount\nan existing PersistentVolumeClaim read-only with no init container, **`git`**\nto clone a repository via a pre-run init container, or **`hf`** to download content\nfrom a Hugging Face Hub repository via a pre-run init container. Omit if the benchmark does\nnot need mounted files.\n"}}}]},"PassCriteriaWithDefault":{"type":"object","description":"Pass/fail threshold criteria.","properties":{"threshold":{"type":"number","format":"float","description":"Threshold value.","default":0.5}}},"ExperimentTag":{"type":"object","description":"Tag on an experiment (e.g. MLFlow)","required":["key","value"],"properties":{"key":{"type":"string","maxLength":250,"description":"Tag key"},"value":{"type":"string","maxLength":5000,"description":"Tag value"}}},"ExperimentConfig":{"type":"object","description":"Configuration for MLFlow experiment tracking","properties":{"name":{"type":"string","description":"Experiment name"},"tags":{"type":"array","items":{"$ref":"#/components/schemas/ExperimentTag"},"maxItems":20,"description":"Experiment tags"},"artifact_location":{"type":"string","description":"Artifact storage location"}}},"OCICoordinates":{"type":"object","description":"OCI artifact coordinates for persistence.","properties":{"oci_host":{"type":"string","title":"OCI Host","description":"OCI registry host (e.g. 'quay.io')"},"oci_repository":{"type":"string","title":"OCI Repository","description":"OCI repository path (e.g. 'my-org/my-repo')"},"oci_tag":{"type":"string","title":"OCI Tag","description":"OCI tag (e.g. 'eval-123')"},"annotations":{"type":"object","additionalProperties":{"type":"string"},"title":"Annotations","description":"Custom annotations for the OCI artifact"}},"required":["oci_host","oci_repository"],"additionalProperties":false,"title":"OCICoordinates"},"OCIConnectionConfig":{"type":"object","description":"Kubernetes connection configuration for OCI registry authentication. References a Kubernetes Secret of type `kubernetes.io/dockerconfigjson` containing a `.dockerconfigjson` entry with standard Docker registry credentials.\n","properties":{"connection":{"type":"string","title":"Connection","description":"Name of a Kubernetes Secret (type kubernetes.io/dockerconfigjson) with a \".dockerconfigjson\" entry used for OCI registry authentication.\n"}},"required":["connection"],"additionalProperties":false,"title":"OCIConnectionConfig"},"OCISigningConfig":{"type":"object","description":"Optional signing configuration for the evaluation bundle, in local and Kubernetes modes. For key-pair signing, secret_ref can reference a tenant namespace Kubernetes Secret expected to contain private.key; the request never contains key material. This configuration does not perform secret lookup, key loading, or signing execution.","properties":{"type":{"type":"string","enum":["key-pair"],"description":"Signing method. Only key-pair is currently supported."},"secret_ref":{"type":["string","null"],"minLength":1,"pattern":"\\S","description":"Optional name of the signing key Secret for key-pair signing. Must not be empty or whitespace-only when provided."}},"required":["type"],"additionalProperties":false},"EvaluationExportsOCI":{"type":"object","description":"OCI export configuration for local and Kubernetes evaluation jobs. Signing configuration is retained only; accepting it does not perform or schedule signing.","examples":[{"coordinates":{"oci_host":"quay.io","oci_repository":"my-org/eval-results"}},{"coordinates":{"oci_host":"quay.io","oci_repository":"my-org/eval-results","oci_tag":"final"},"k8s":{"connection":"my-oci-secret"},"signing":{"type":"key-pair","secret_ref":"my-cosign-secret"}}],"properties":{"coordinates":{"$ref":"#/components/schemas/OCICoordinates","description":"Coordinates where the OCI artifact should be stored"},"k8s":{"$ref":"#/components/schemas/OCIConnectionConfig","description":"Optional Kubernetes connection for OCI registry authentication"},"signing":{"$ref":"#/components/schemas/OCISigningConfig","description":"Optional signing configuration. Signing is disabled when omitted."}},"required":["coordinates"],"additionalProperties":false,"title":"EvaluationExportsOCI"},"EvaluationExports":{"type":"object","description":"Optional exports configuration for an evaluation job. When provided, the evaluation job results will be exported to the specified location.\n","properties":{"oci":{"$ref":"#/components/schemas/EvaluationExportsOCI","description":"The OCI artifact export configuration.\n"}},"additionalProperties":false,"title":"EvaluationExports"},"EvaluationJobConfigCommon2":{"type":"object","title":"EvaluationJobConfigCommon2","description":"The evaluation job request configuration.\n","properties":{"experiment":{"$ref":"#/components/schemas/ExperimentConfig","description":"The MLFlow experiment configuration. When provided, the evaluation job will be tracked in MLFlow.\n"},"exports":{"$ref":"#/components/schemas/EvaluationExports","description":"Optional exports configuration for the evaluation job. When provided, the evaluation job results will be exported to the specified location.\n"},"hardware_config":{"$ref":"#/components/schemas/BenchmarkHardwareConfig","description":"Optional evaluation-level hardware override for Kubernetes-backed jobs. Applied as a fallback for every benchmark that does not specify its own `hardware_config`. Prefer per-benchmark `hardware_config` when individual benchmarks need different hardware. When neither is set, the deprecated top-level `queue` field may still supply a scheduling queue.\n"},"queue":{"$ref":"#/components/schemas/QueueConfig","deprecated":true,"description":"Deprecated. Prefer `benchmark.hardware_config` or evaluation-level `hardware_config` instead. This field will be discontinued in a future release. Retained for backward compatibility: when neither `benchmark.hardware_config` nor evaluation `hardware_config` is set, this queue is applied to scheduled jobs. When a benchmark references a queue-backed HardwareProfile (or sets `hardware_config.queue`), that configuration takes precedence over this field.\n"},"custom":{"type":"object","additionalProperties":true,"description":"Custom request data. This can be used for user specific job data.\n"}}},"EvaluationJobConfigBenchmarks":{"allOf":[{"$ref":"#/components/schemas/EvaluationJobConfigCommon1"},{"type":"object","required":["benchmarks"],"properties":{"benchmarks":{"type":"array","items":{"$ref":"#/components/schemas/EvaluationBenchmarkConfig"},"description":"The evaluation benchmarks to run.\n"},"pass_criteria":{"$ref":"#/components/schemas/PassCriteriaWithDefault","description":"The overal
