name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # uv tool/package cache only (keys derived from uv lockfiles).
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install commitizen
        run: uv pip install --system commitizen==4.16.4

      - name: Lint commit messages
        run: cz check --rev-range origin/main..HEAD  --allowed-prefixes "EH " "Merge " "merge:"
