name: Pre-commit file checks

on:
  pull_request:
  push:
    branches: [main]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: uv pip install --system pre-commit==4.6.2

      - name: Run file hygiene checks
        run: |
          failed=0
          for hook in \
            end-of-file-fixer \
            trailing-whitespace \
            check-yaml \
            check-json \
            check-toml \
            check-merge-conflict \
            check-added-large-files; do
            pre-commit run "$hook" --all-files || failed=1
          done
          exit "$failed"
