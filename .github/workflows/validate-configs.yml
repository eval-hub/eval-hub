name: Validate provider and collection configs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate bundled provider and collection YAML
        run: go run ./cmd/validate_configs
