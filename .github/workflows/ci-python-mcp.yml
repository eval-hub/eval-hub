name: CI python-mcp

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'python-mcp/**'
      - 'cmd/evalhub_mcp/**'
      - 'internal/evalhub_mcp/**'
      - 'pkg/**'
      - 'Makefile'
      - '.github/workflows/ci-python-mcp.yml'

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  test-mcp-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Set up uv python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.11'
          ignore-empty-workdir: true
      - name: Build MCP binary for this platform via cross-compile target
        run: make cross-compile-mcp
      - name: Build MCP wheel
        run: make build-mcp-wheel
      - name: Install MCP wheel
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv python-mcp/dist/*.whl
      - name: MCP wheel sanity test
        run: uv run --python .venv eval-hub-mcp --version
