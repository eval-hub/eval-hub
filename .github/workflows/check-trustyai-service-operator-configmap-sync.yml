name: Check ConfigMap trustyai-service-operator is in sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly at 2 AM UTC
  workflow_dispatch: {}

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements-configmap-sync.txt
      - run: python scripts/check_configmap_sync.py
