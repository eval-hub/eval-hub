name: Release MCP

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Build all platforms
      run: make build-all-platforms-mcp

    - name: Generate checksums
      run: cd bin && sha256sum evalhub-mcp-* > checksums-sha256.txt

    # GitHub Release creation and SLSA provenance are owned by signed-release.yml.
    # This job only uploads MCP binaries into that release (draft or published).
    - name: Wait for GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        for i in $(seq 1 60); do
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} is available"
            exit 0
          fi
          echo "Waiting for release ${TAG} (attempt ${i}/60)..."
          sleep 10
        done
        echo "::error::Timed out waiting for GitHub Release ${TAG}. The signed-release workflow must create the release; MCP does not call gh release create."
        exit 1

    - name: Upload MCP assets to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        gh release upload "${TAG}" \
          bin/evalhub-mcp-* \
          bin/checksums-sha256.txt \
          --clobber
