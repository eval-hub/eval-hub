name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # uv tool/package cache only (keys derived from uv lockfiles); Go uses setup-go above.
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: make install-deps

    - name: Format check
      run: |
        make fmt
        git diff --exit-code -- '*.go' || (echo "Code is not formatted. Run 'make fmt' locally." && exit 1)

    - name: Reject inline gosec suppressions
      run: |
        if grep -rn -E '#nosec|//gosec:disable' --include='*.go' .; then
          echo "Found inline gosec suppression annotations (#nosec or //gosec:disable) in Go files."
          echo "Remove them and fix the underlying code."
          echo "If a finding cannot be structurally fixed, add a path-scoped --exclude-rules entry"
          echo "in the Gosec Security Scanner step of this workflow instead."
          exit 1
        fi

    - name: Run linter
      run: make lint

    - name: Run vet
      run: make vet

    - name: Run govulncheck
      run: make govulncheck

    - name: Check benchmark provider fixture counts
      run: go test ./tests/features -run '^TestBenchmarkProviderFixtureCounts$'

    - name: Check disconnected e2e unit tests
      run: >-
        go test ./tests/e2e -run
        '^(TestCuratedBenchmarkMatrixComplete|TestCuratedBenchmarkMatrixMatchesRepositoryConfigs|TestCasesWithCatalogEntriesSeparatesMissingRows|TestRefreshDeploymentTestAPIClientRenewsToken|TestDiscoverDeploymentManifest|TestDeploymentManifestAdapterSelection|TestDeploymentManifestVerifiesProviderImage|TestSelectedAdapterProviderMappingsCoverSupportedAdapters|TestLightEvalStagerCanWriteItsRegistryAsset|TestIsTerminalEvaluationPod|TestFilterCuratedCasesForHFToken|TestHFStagerEnvUsesOptionalSecretReference|TestEvaluationJobStatusDetailsHandlesMissingStatus|TestDiscoverManagedDeploymentNamespaces|TestAdapterImageDetails|TestAdapterIDsForCasesCoversEverySelectedProvider|TestCuratedEvaluationBenchmarkDoesNotMutateCatalog)$'

    - name: Run development script regression tests
      run: make test-scripts

    - name: Run all tests (unit and integration) with coverage
      run: |
        make clean build test-all-coverage
      env:
        GOFLAGS: "-p=1"

    - name: Upload coverage reports to Codecov
      # Only upload from the canonical repo, not forks
      if: github.repository == 'eval-hub/eval-hub'
      continue-on-error: ${{ github.actor == 'dependabot[bot]' }}  # Don't fail CI on Dependabot PRs since they can't access secrets
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./bin/coverage.out,./bin/coverage-fvt.out,./bin/coverage-init.out
        disable_search: true
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build and verify the API documentation
      run: |
        npm ci
        make documentation
        git diff --exit-code || (echo "API documentation is not generated. Run 'make documentation' locally." && exit 1)

  security-scan:
    name: Gosec Security Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Run Gosec Security Scanner
      # The recommended way to run the gosec scanner is to use -no-fail
      # https://github.com/securego/gosec#integrating-with-code-scanning
      # The problem is that this can hide some errors (such as golang version mismatch)
      # that are not caught by the following steps.
      #
      # --exclude-rules: G204 is suppressed only for local_runtime.go because
      # the local runtime intentionally executes provider-configured shell
      # commands (exec.Command("sh", "-c", …)); there is no structural
      # alternative.  Inline #nosec annotations are banned by the "Reject
      # inline gosec suppressions" CI step; all exclusions must be managed
      # here via --exclude-rules with a path-scoped regex.  Rules are grouped
      # as "path:rule1,rule2" with ';' between paths.
      # G101 is excluded only for shared/data_sources.go: PostProcessorSecretRoot
      # is a filesystem mount path, not a hardcoded credential.
      # The action splits args without shell quote parsing; keep the combined
      # exclusion value unquoted so quote characters do not enter the regexes.
      #
      # G402 (InsecureSkipVerify) is suppressed only for
      # internal/eval_runtime_sidecar/proxy/http_client.go: buildTLSConfig turns
      # verification off only when sidecar_config.json explicitly sets
      # insecure_skip_verify for a local/dev endpoint with a self-signed
      # certificate; it refuses to do so in FIPS mode (platform.IsFIPS /
      # fips140.Enabled) and the MLflow and OCI callers always pass false.
      env:
        # make sure that we use the golang version required by the project
        GOSECGOVERSION: go1.27.3
        GOTOOLCHAIN: go1.27.3
      # Pinned past the v2.30.0 tag on purpose: the tag commit's action.yml still
      # resolved the gosec 2.29.0 image (sha256:a6cd2f30…), which bundles
      # golang.org/x/tools v0.49.0 and cannot read Go 1.27 export data
      # ("cannot decode \"fmt\", export data version 5 is greater than maximum
      # supported version 4").  4504603 is upstream's "Fix the tag in the action",
      # the first commit whose action.yml references the gosec 2.30.0 image
      # (x/tools v0.52.0, export data version 5).  Move to v2.30.1 or later once
      # a tag publishes that image, and keep this pin in step with go.mod.
      uses: securego/gosec@4504603eddc5a91a7b7713932d6d1d3792126103 # v2.30.0 image
      with:
        args: >-
          -fmt sarif -out gosec-results.sarif -stdout -verbose=text
          -exclude-dir=tests
          --exclude-rules=internal/eval_hub/runtimes/local/local_runtime\.go:G204;internal/eval_runtime_sidecar/proxy/http_client\.go:G402;internal/eval_hub/runtimes/shared/data_sources\.go:G101
          ./...

    - name: Upload SARIF file to GitHub Security tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: always()
      with:
        sarif_file: gosec-results.sarif
        category: "gosec-security-scan"

    - name: Upload Gosec results as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: gosec-results
        path: gosec-results.sarif

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [quality-checks]
    if: github.event_name == 'pull_request'

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Containerfile
        push: false
        load: true
        tags: evalhub:pr-check

    - name: Dry-run Docker image
      run: docker run --rm evalhub:pr-check /app/eval-hub --local --help

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [quality-checks]
    if: github.event_name == 'push'

    env:
      IMAGE_REGISTRY: quay.io
      IMAGE_REPOSITORY: evalhub/evalhub

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Log in to Quay.io
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      with:
        images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
        # Branch push: <branch>-<sha>, <branch>, latest
        # Tag push (v1.2.3): 1.2.3, 1.2, latest
        tags: |
          type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=${{ github.ref_name }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=latest
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build
      with:
        context: .
        file: Containerfile
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          ${{ steps.meta.outputs.labels }}
          ${{ !startsWith(github.ref, 'refs/tags/') && 'quay.expires-after=12w' || '' }}
        annotations: |
          ${{ steps.meta.outputs.annotations }}
          ${{ !startsWith(github.ref, 'refs/tags/') && 'manifest:quay.expires-after=12w' || '' }}
          ${{ !startsWith(github.ref, 'refs/tags/') && 'index:quay.expires-after=12w' || '' }}

    - name: Dry-run Docker image
      run: |
        IMAGE_REF=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        docker pull "${IMAGE_REF}"
        docker run --rm "${IMAGE_REF}" /app/eval-hub --local --help
