# Reusable workflow: create/update one GitHub Release with project-level assets
# and SLSA provenance (via GitHub artifact attestations). Called by signed-release.yml.
name: Signed release (single tag)

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        type: string
      publish:
        description: Undraft the release after provenance is attached
        required: false
        type: boolean
        default: false
      create_if_missing:
        description: Create a draft release if the tag has no GitHub Release yet
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Normalize tag
        id: meta
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RAW_TAG#refs/tags/}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid tag: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check existing provenance
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} does not exist yet"
            exit 0
          fi
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qF 'provenance.sigstore.json'; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} already has provenance.sigstore.json; skipping"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Remove stale attestation asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} does not exist yet; nothing to clean up"
            exit 0
          fi
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qF 'attestation.json'; then
            gh release delete-asset "${TAG}" attestation.json --yes
            echo "Removed stale attestation.json from ${TAG}"
          else
            echo "No stale attestation.json on ${TAG}"
          fi

      - name: Build project release assets
        if: steps.check.outputs.skip != 'true'
        id: assets
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="eval-hub-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="eval-hub-${TAG}/" -o "dist/${ARCHIVE}" "${TAG}"
          (
            cd dist
            sha256sum "${ARCHIVE}" > SHA256SUMS
          )
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Ensure GitHub Release and upload assets
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCHIVE: ${{ steps.assets.outputs.archive }}
          CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading project assets"
          else
            if [[ "${CREATE_IF_MISSING}" != "true" ]]; then
              echo "Release ${TAG} does not exist and create_if_missing is false"
              exit 1
            fi
            echo "Creating draft release ${TAG}"
            cat > /tmp/evalhub-release-notes.md <<EOF
            ## Summary

            EvalHub **${TAG}** is published as a signed GitHub Release with project
            source assets and SLSA provenance (\`provenance.sigstore.json\`).

            ## Upgrade impact

            - Prefer assets from this GitHub Release over unverified copies.
            - Verify the source archive with \`gh attestation verify\` (see \`SECURITY.md\`).
            - Optional MCP binaries may be attached by the Release MCP workflow; treat
              them as the same release version as this tag.
            - Replace this body with curated release notes (major changes and upgrade
              impact) via the release-notes skill when ready — do not leave raw
              \`git log\` or unedited \`--generate-notes\` output as the final notes.
          EOF
            # Strip leading indentation from the heredoc for readable GitHub markdown.
            sed -i 's/^            //' /tmp/evalhub-release-notes.md
            gh release create "${TAG}" --draft --title "${TAG}" \
              --notes-file /tmp/evalhub-release-notes.md
          fi

          # Upload project-level assets (clobber if re-running). Fail clearly on immutable releases.
          if ! gh release upload "${TAG}" "dist/${ARCHIVE}" "dist/SHA256SUMS" --clobber; then
            echo "::error::Failed to upload assets to ${TAG}. If immutable releases are enabled, published releases cannot gain new assets; only new draft→publish releases can be signed."
            exit 1
          fi

      - name: Attest build provenance
        if: steps.check.outputs.skip != 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.assets.outputs.archive }}
            dist/SHA256SUMS

      - name: Upload attestation bundle and trusted root to release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Scorecard Signed-Releases matches asset *name*, not label.
          # gh release upload '#' only sets the label, so we must rename
          # the file itself to *.sigstore.json for Scorecard detection.
          cp "${BUNDLE_PATH}" dist/provenance.sigstore.json
          gh attestation trusted-root > dist/trusted_root.jsonl
          gh release upload "${TAG}" \
            dist/provenance.sigstore.json \
            dist/trusted_root.jsonl \
            --clobber

  publish:
    needs: [prepare]
    if: inputs.publish && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Wait for MCP release assets (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Prefer attaching optional MCP binaries before undraft (immutable-release
          # friendly when MCP succeeds). MCP failure must not block publish — the
          # signed release is independent of MCP, and release-mcp.yml uses --clobber
          # so binaries can still land on a published (mutable) release later.
          attempt=0
          settle=0
          while true; do
            attempt=$((attempt + 1))
            ASSETS="$(gh release view "${TAG}" --json assets --jq '[.assets[].name]')"
            mcp_bins="$(echo "${ASSETS}" | jq '[.[] | select(startswith("evalhub-mcp-"))] | length')"
            has_checksums="$(echo "${ASSETS}" | jq 'any(.[]; . == "checksums-sha256.txt")')"
            if [[ "${mcp_bins}" -ge 1 && "${has_checksums}" == "true" ]]; then
              echo "MCP assets present on ${TAG} (binaries=${mcp_bins})"
              exit 0
            fi

            mapfile -t RUN_LINES < <(
              gh run list --workflow=release-mcp.yml --commit "${SHA}" --limit 20 \
                --json databaseId,status,conclusion \
                --jq '.[] | "\(.databaseId)\t\(.status)\t\(.conclusion // "")"'
            )

            active=0
            concluded_ok=0
            concluded_fail=0
            for line in "${RUN_LINES[@]:-}"; do
              [[ -z "${line}" ]] && continue
              status="$(echo "${line}" | cut -f2)"
              conclusion="$(echo "${line}" | cut -f3)"
              case "${status}" in
                queued|pending|in_progress|waiting|requested)
                  active=$((active + 1))
                  ;;
                completed)
                  if [[ "${conclusion}" == "success" ]]; then
                    concluded_ok=$((concluded_ok + 1))
                  else
                    concluded_fail=$((concluded_fail + 1))
                  fi
                  ;;
              esac
            done

            if [[ "${active}" -gt 0 ]]; then
              echo "Waiting for Release MCP upload (active=${active}, poll=${attempt})..."
              sleep 15
              continue
            fi

            if [[ "${#RUN_LINES[@]}" -eq 0 ]]; then
              if [[ "${attempt}" -ge 40 ]]; then
                echo "::warning::Release MCP workflow never started for commit ${SHA}; publishing without MCP assets."
                exit 0
              fi
              echo "Release MCP workflow not listed yet for ${SHA}; waiting (poll=${attempt})..."
              sleep 15
              continue
            fi

            if [[ "${concluded_ok}" -eq 0 ]]; then
              echo "::warning::Release MCP finished without uploading assets to ${TAG} (failed/cancelled runs=${concluded_fail}); publishing without MCP assets."
              exit 0
            fi

            settle=$((settle + 1))
            echo "Release MCP succeeded but MCP assets not visible yet; retrying (settle=${settle})..."
            sleep 15
            if [[ "${settle}" -ge 20 ]]; then
              echo "::warning::Release MCP succeeded for ${SHA} but MCP assets never appeared on ${TAG}; publishing without MCP assets."
              exit 0
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "${TAG}" --json body --jq '.body')"
          if echo "${BODY}" | grep -q "Replace this body with curated release notes"; then
            echo "::warning::Release ${TAG} still has placeholder notes. Skipping undraft — replace the body with curated release notes before publishing."
            exit 0
          fi
          gh release edit "${TAG}" --draft=false
          echo "Published release ${TAG}"
