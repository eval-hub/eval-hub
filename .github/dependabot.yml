version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # Composite actions (e.g. codeql-action/init vs analyze) are separate
      # Dependabot deps; group by prefix so related bumps share one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      docker-actions:
        patterns:
          - "docker/*"
      github-actions-core:
        patterns:
          - "actions/*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      golang-dependencies:
        # for now we only do this for version updates
        # "security-updates" are still done one by one
        applies-to: version-updates
        patterns:
          - "*"       # A wildcard that matches all dependencies in the package
                      # ecosystem. Note: using "*" may open a large pull request

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      npm-dependencies:
        # for now we only do this for version updates
        # "security-updates" are still done one by one
        applies-to: version-updates
        patterns:
          - "*"       # A wildcard that matches all dependencies in the package
                      # ecosystem. Note: using "*" may open a large pull request
